server {
    listen 80;
    listen [::]:80;
    server_name study.statisticslab.de;

    access_log off;
    error_log /var/log/nginx/passwo-study-error.log crit;

    location /.well-known/acme-challenge/ {
        root /var/www/passwo-certbot;
    }

    location / {
        return 301 https://study.statisticslab.de$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name study.statisticslab.de;

    ssl_certificate /etc/letsencrypt/live/study.statisticslab.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/study.statisticslab.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PASSWO_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    access_log off;
    error_log /var/log/nginx/passwo-study-error.log crit;
    client_max_body_size 512k;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header User-Agent "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
    }
}

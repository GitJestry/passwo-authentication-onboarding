map $http_cookie $passwo_production_cookie {
    default "";
    "~(?:^|;\s*)(?<passwo_production_cookie_pair>__Host-passwo-resume=[^;]+)" $passwo_production_cookie_pair;
}

map $http_cookie $passwo_qa_supportive_cookie {
    default "";
    "~(?:^|;\s*)(?<passwo_qa_supportive_cookie_pair>__Host-passwo-qa-supportive-resume=[^;]+)" $passwo_qa_supportive_cookie_pair;
}

map $http_cookie $passwo_qa_reference_cookie {
    default "";
    "~(?:^|;\s*)(?<passwo_qa_reference_cookie_pair>__Host-passwo-qa-reference-resume=[^;]+)" $passwo_qa_reference_cookie_pair;
}

server {
    listen 80;
    listen [::]:80;
    server_name study.statisticslab.de;

    access_log off;
    error_log /var/log/nginx/passwo-study-error.log crit;

    location /.well-known/acme-challenge/ {
        root /var/www/passwo-certbot;
    }

    location / {
        return 301 https://study.statisticslab.de$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name study.statisticslab.de;

    # PassWo proxied asset compression. Kept in server scope so it does not
    # duplicate Debian's global `gzip on` directive in nginx.conf.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/xml
        image/svg+xml;


    ssl_certificate /etc/letsencrypt/live/study.statisticslab.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/study.statisticslab.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PASSWO_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    access_log off;
    error_log /var/log/nginx/passwo-study-error.log crit;
    client_max_body_size 512k;

    # Protected live QA uses two isolated in-memory runtimes. The selected URL is
    # routed to a server-side forced condition; no condition is accepted in study API payloads.
    location = /qa {
        auth_basic "PassWo Live QA";
        auth_basic_user_file /etc/nginx/passwo-live-qa.htpasswd;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header User-Agent "";
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
    }

    location ^~ /qa/ {
        auth_basic "PassWo Live QA";
        auth_basic_user_file /etc/nginx/passwo-live-qa.htpasswd;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header User-Agent "";
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
    }

    location ^~ /qa/reference/ {
        auth_basic "PassWo Live QA";
        auth_basic_user_file /etc/nginx/passwo-live-qa.htpasswd;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

        proxy_pass http://127.0.0.1:3102;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header User-Agent "";
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
    }

    location ^~ /qa/supportive/runtime/ {
        auth_basic "PassWo Live QA";
        auth_basic_user_file /etc/nginx/passwo-live-qa.htpasswd;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

        proxy_pass http://127.0.0.1:3101/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header User-Agent "";
        proxy_set_header Authorization "";
        proxy_set_header Cookie $passwo_qa_supportive_cookie;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
    }

    location ^~ /qa/reference/runtime/ {
        auth_basic "PassWo Live QA";
        auth_basic_user_file /etc/nginx/passwo-live-qa.htpasswd;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

        proxy_pass http://127.0.0.1:3102/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header User-Agent "";
        proxy_set_header Authorization "";
        proxy_set_header Cookie $passwo_qa_reference_cookie;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
    }

    # Serve immutable Vite assets directly. The build creates matching .gz files,
    # avoiding Fastify and repeated on-the-fly compression for the multi-megabyte app bundle.
    location ^~ /assets/ {
        alias /opt/passwo-study/current/apps/study-web/dist/assets/;
        autoindex off;
        sendfile on;
        tcp_nopush on;
        etag on;
        gzip_static on;
        open_file_cache max=256 inactive=60s;
        open_file_cache_valid 120s;
        open_file_cache_min_uses 2;
        open_file_cache_errors on;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;

        limit_except GET HEAD {
            deny all;
        }
    }

    # The frozen SecAware reference contains about 60 MB of small Rise/Storyline
    # bundles and three MP4 files. Serve it outside Fastify so Nginx can use
    # sendfile, efficient byte-range responses, and a long-lived browser cache.
    location ^~ /reference/secaware/passwords-authentication/ {
        alias /opt/passwo-study/current/research/private/reference/secaware/passwords-authentication/2026-07-26/study-build/;
        autoindex off;
        sendfile on;
        tcp_nopush on;
        etag on;
        open_file_cache max=512 inactive=60s;
        open_file_cache_valid 120s;
        open_file_cache_min_uses 2;
        open_file_cache_errors on;

        add_header Accept-Ranges "bytes" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "default-src 'self' data: blob:; base-uri 'self'; connect-src 'self' blob:; font-src 'self' data:; form-action 'self'; frame-src 'self' data: blob:; img-src 'self' data: blob:; manifest-src 'self'; media-src 'self' data: blob:; object-src 'self' data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; frame-ancestors 'self'" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;

        limit_except GET HEAD {
            deny all;
        }
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header User-Agent "";
        proxy_set_header Authorization "";
        proxy_set_header Cookie $passwo_production_cookie;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
    }
}

email:
  subject: Zweiter Studienteil ist jetzt verfügbar
  containsAuthenticationAdvice: false
  body: |-
    Hallo,

    vor zehn Tagen hast du den ersten Teil unserer Studie zu einem digitalen Lernangebot über Passwörter und den Schutz von Online-Konten abgeschlossen. Der kurze zweite und letzte Studienteil ist jetzt verfügbar und dauert etwa ein bis zwei Minuten.

    Zum zweiten Studienteil: [TOKEN_LINK]

    Bitte beziehe deine Angaben ausschließlich auf den bereits abgeschlossenen Zeitraum bis [STICHTAG]. Der Link ist bis [CLOSES_AT] gültig und darf nicht weitergegeben werden. Deine Teilnahme bleibt freiwillig. Nach der Abgabe erhältst du die vollständige Aufklärung zur Studie.

    Vielen Dank für deine Unterstützung.
reminderEmail:
  subject: 'Erinnerung: zweiter Studienteil'
  containsAuthenticationAdvice: false
  body: |-
    Hallo,

    dies ist die einmalige Erinnerung an den zweiten und letzten Teil deiner Studienteilnahme. Falls du bereits teilgenommen hast, kannst du diese Nachricht ignorieren.

    Zum zweiten Studienteil: [TOKEN_LINK]

    Bitte beziehe deine Angaben ausschließlich auf den bereits abgeschlossenen Zeitraum bis [STICHTAG]. Der Link ist bis [CLOSES_AT] gültig und darf nicht weitergegeben werden. Deine Teilnahme bleibt freiwillig.
debriefEmail:
  subject: Aufklärung zu deiner Studienteilnahme
  sendAt: closesAt
  recipients: all-enrolled-participants
  contentSource: docs/research/PARTICIPANT-INFORMATION.md#full-debrief-text
  delivery: full-content-inline
  body: |-
    Vielen Dank für deine Teilnahme. Jetzt möchten wir dich vollständig über den Zweck der Studie aufklären.

    In der Studie vergleichen wir zwei vollständige digitale Lernangebote zu Passwörtern und zum Schutz von Online-Konten. Welches Lernangebot du erhalten hast, wurde zufällig zugewiesen. Ein weiterer Untersuchungsfokus liegt auf drei selbstberichteten Schutzhandlungen innerhalb von zehn Tagen: dem Ersetzen eines wiederverwendeten oder nur leicht veränderten Passworts, dem Erzeugen und Speichern eines kontospezifischen Passworts mit einem Passwortmanager und der Aktivierung von MFA/2FA bei mindestens einem Konto.

    Diese Einzelheiten wurden vor Abschluss des zweiten Studienteils nicht genannt, weil das Wissen um den Vergleich und die konkreten Handlungsfragen deine Bearbeitung, deine Antworten oder dein Verhalten im Messzeitraum hätte beeinflussen können. Die unvollständige Offenlegung bezog sich nur auf diese genaue Forschungsfrage; Ablauf, Dauer, Kontaktaufnahme, Freiwilligkeit und Datenverarbeitung wurden vorab beschrieben.

    Die Angaben des zweiten Teils sind Selbstberichte. Wir haben keine realen Konten beobachtet und keine Passwörter oder Kontozugangsdaten erhoben. Die Ergebnisse erlauben keine Aussage darüber, ob eine Konfiguration objektiv korrekt abgeschlossen wurde, ob sich dasselbe Verhalten gegenüber einem Ausgangswert verändert hat oder ob eine Handlung dauerhaft beibehalten wird. Die drei Handlungen werden getrennt ausgewertet; es wird kein gemeinsamer Verhaltenswert gebildet.

    Deine Teilnahme bleibt freiwillig. Wenn du die Löschung deiner Forschungsdaten verlangen möchtest, wende dich mit deinem Löschcode an Julian Meyer, s27jmeye@uni-bonn.de. Bei Fragen zur Studie oder zur Aufklärung kannst du dich ebenfalls an diese Adresse wenden.

    Bis zum Ende der Datenerhebung am [STUDIENENDE] bitten wir dich, Personen, die möglicherweise noch teilnehmen, nichts über die zurückgehaltene Fragestellung, die verglichenen Lernangebote oder die Fragen des zweiten Teils zu erzählen. So hilfst du uns, deren Bearbeitung nicht zu beeinflussen. Diese Bitte ist freiwillig und hat keinen Einfluss auf deine Rechte.
questionnaire:
  title: Zweiter und letzter Studienteil
  reportingInstruction: Bitte beziehe dich ausschließlich auf Handlungen, die du nach deiner Studienteilnahme und bereits vor [STICHTAG] abgeschlossen hattest.
  safetyNote: Öffne oder ändere für diese Befragung keine Kontoeinstellungen. Bitte nenne keine Konten, Dienste, Passwörter, Anmeldecodes oder Wiederherstellungsdaten.
  items:
    - id: FU_PASSWORD_PM_ACTIONS
      type: multiChoice
      prompt: Welche der folgenden Handlungen hast du nach der Studie und vor dem oben genannten Zeitpunkt durchgeführt?
      instruction: Mehrfachauswahl ist möglich. Integrierte und separat installierte Passwortmanager zählen gleichermaßen.
      options:
        - id: replaced_reused_or_varied_password
          label: Ich habe bei mindestens einem bestehenden Konto ein Passwort ersetzt, das ich auch bei einem anderen Konto verwendet oder nur leicht verändert hatte.
        - id: inspected_available_manager
          label: Ich habe geprüft, welcher Passwortmanager auf meinem Gerät oder in meinem Browser verfügbar ist.
        - id: generated_stored_account_specific
          label: Ich habe mit einem Passwortmanager für mindestens eines meiner Konten ein eigenes Passwort erzeugt und gespeichert.
        - id: used_retrieval_or_autofill
          label: Ich habe ein gespeichertes Passwort bewusst über Autofill oder durch Abruf aus dem Passwortmanager verwendet.
        - id: none
          label: Keine dieser Handlungen.
      exclusiveOptions: [none]
    - id: FU_MFA_ACTIONS
      type: multiChoice
      prompt: Welche der folgenden Handlungen hast du nach der Studie und vor dem oben genannten Zeitpunkt durchgeführt?
      instruction: Mehrfachauswahl ist möglich.
      options:
        - id: checked_availability_or_status
          label: Ich habe bei mindestens einem Konto geprüft, ob MFA/2FA verfügbar oder bereits aktiviert ist.
        - id: enabled_mfa
          label: Ich habe MFA/2FA bei mindestens einem meiner Konten aktiviert.
        - id: none
          label: Keine dieser Handlungen.
      exclusiveOptions: [none]
    - id: FU_REUSE_OPPORTUNITY
      type: singleChoice
      prompt: Gab es nach deiner Einschätzung bereits vor der Studie mindestens zwei Konten, für die du dasselbe Passwort oder nur leicht veränderte Varianten desselben Passworts verwendet hast?
      options:
        - id: yes
          label: Ja.
        - id: no
          label: Nein.
        - id: unsure
          label: Unsicher.
        - id: prefer_not_to_answer
          label: Möchte ich nicht angeben.
    - id: FU_PASSWORD_PM_NONE_REASON
      type: singleChoice
      displayWhen:
        itemId: FU_PASSWORD_PM_ACTIONS
        contains: none
      prompt: Was war der wichtigste Grund dafür, dass du im Bereich Passwörter und Passwortmanager keine der genannten Handlungen durchgeführt hast?
      options:
        - id: already_completed
          label: Die relevanten Schritte waren bereits vor der Studie erledigt.
        - id: no_opportunity
          label: Im Zeitraum bestand keine passende Gelegenheit.
        - id: intended_not_done
          label: Die Handlung ist weiterhin beabsichtigt, aber noch nicht erfolgt.
        - id: unsure_how
          label: Ich war unsicher über die konkrete Umsetzung.
        - id: time_or_effort
          label: Der zeitliche oder praktische Aufwand war zu hoch.
        - id: trust_access_recovery_concerns
          label: Ich hatte Bedenken bezüglich Vertrauen, Zugang oder Wiederherstellung.
        - id: technical_barrier
          label: Es gab technische Hindernisse.
        - id: not_relevant
          label: Das Thema hatte derzeit keine persönliche Relevanz.
        - id: other
          label: Anderer Grund.
      otherText:
        optional: true
        maxLength: 300
    - id: FU_MFA_NONE_REASON
      type: singleChoice
      displayWhen:
        itemId: FU_MFA_ACTIONS
        contains: none
      prompt: Was war der wichtigste Grund dafür, dass du im Bereich MFA/2FA keine der genannten Handlungen durchgeführt hast?
      options:
        - id: already_completed
          label: Die relevanten Schritte waren bereits vor der Studie erledigt.
        - id: no_opportunity
          label: Im Zeitraum bestand keine passende Gelegenheit.
        - id: intended_not_done
          label: Die Handlung ist weiterhin beabsichtigt, aber noch nicht erfolgt.
        - id: unsure_how
          label: Ich war unsicher über die konkrete Umsetzung.
        - id: time_or_effort
          label: Der zeitliche oder praktische Aufwand war zu hoch.
        - id: trust_access_recovery_concerns
          label: Ich hatte Bedenken bezüglich Vertrauen, Zugang oder Wiederherstellung.
        - id: technical_barrier
          label: Es gab technische Hindernisse.
        - id: not_relevant
          label: Das Thema hatte derzeit keine persönliche Relevanz.
        - id: other
          label: Anderer Grund.
      otherText:
        optional: true
        maxLength: 300
analysis:
  outcomeFamilyRole: central-secondary
  outcomeLabel: selbstberichtete Schutzhandlungen innerhalb von zehn Tagen
  focalOutcomes:

    nativeArtifactCheckPolicy:
      passwoNativeLearningChecksRetained: true
      secAwareNativeQuizIncludedInMeasuredPath: false
      secAwareQuizRemovalReason: avoid_immediate_feedback_contamination_of_external_guardrail
      externalItemsMustBeNovelAndTransferOriented: true
    blocks:
    - id: scenarios
      submitLocksBlock: true
      items:
      - id: SC_BREACH_REUSE
        prompt: Das bei einem Onlineshop verwendete Passwort ist nach einem Datenleck bekannt geworden. Eine Person hat dasselbe
          Passwort auch für ihr E-Mail-Konto verwendet. Welche Änderung an den Passwörtern begrenzt das Risiko für beide Konten
          am direktesten?
        options:
        - id: new_distinct_both
          label: Für beide Konten jeweils ein neues und voneinander unterschiedliches Passwort festlegen.
          classification: appropriate
        - id: change_shop_only
          label: Nur beim Onlineshop ein neues Passwort festlegen und das Passwort des E-Mail-Kontos beibehalten.
          classification: unsafe
        - id: mfa_email_keep_shared
          label: Beim E-Mail-Konto MFA/2FA aktivieren und das bisherige gemeinsame Passwort ansonsten beibehalten.
          classification: unsafe
        - id: unsure
          label: Weiß ich nicht.
          classification: uncertainty
      - id: SC_PM_MANY_ACCOUNTS
        prompt: Eine Person möchte für viele Konten unterschiedliche Passwörter verwenden, kann sie aber nicht alle im Kopf
          behalten. Welche Vorgehensweise löst dieses Problem am direktesten?
        options:
        - id: own_with_pm
          label: Für jedes Konto ein eigenes Passwort mit einem Passwortmanager erzeugen, speichern und beim Anmelden verwenden.
          classification: appropriate
        - id: unique_important_reuse_others
          label: Nur für wichtige Konten eigene Passwörter verwenden und bei den übrigen dasselbe Passwort wiederverwenden.
          classification: unsafe
        - id: one_strong_everywhere
          label: Ein besonders starkes Passwort festlegen und dieses anschließend bei allen Konten verwenden.
          classification: unsafe
        - id: unsure
          label: Weiß ich nicht.
          classification: uncertainty
      - id: SC_LAYERED_PROTECTION
        prompt: Eine Person schützt ihr E-Mail-Konto und ein Shopping-Konto. Für beide Konten stehen starke Passwörter und
          MFA/2FA zur Verfügung. Welche Konfiguration schützt beide Konten am umfassendsten, falls eines der Passwörter bekannt
          wird?
        options:
        - id: unique_and_mfa
          label: Für jedes Konto ein eigenes starkes Passwort verwenden und MFA/2FA aktivieren.
          classification: appropriate
        - id: unique_without_mfa
          label: Für jedes Konto ein eigenes starkes Passwort verwenden, aber MFA/2FA nicht aktivieren.
          classification: incomplete
        - id: shared_strong_with_mfa
          label: Dasselbe starke Passwort bei beiden Konten verwenden, weil MFA/2FA aktiviert ist.
          classification: unsafe
        - id: unsure
          label: Weiß ich nicht.
          classification: uncertainty
    - id: recognition
      submitLocksBlock: true
      items:
      - id: MR_REUSE
        prompt: Warum kann ein bei einem Dienst bekannt gewordenes Passwort auch andere Konten gefährden?
        options:
        - id: same_tried_elsewhere
          label: Angreifer können dasselbe Passwort bei anderen Diensten ausprobieren.
          classification: correct
        - id: leak_contains_all
          label: Ein Datenleck bei einem Dienst enthält automatisch auch die Passwörter aller anderen Dienste.
          classification: incorrect_mechanism
        - id: same_email_auto_connected
          label: Konten mit derselben E-Mail-Adresse sind technisch automatisch miteinander verbunden.
          classification: incorrect_mechanism
        - id: unsure
          label: Weiß ich nicht.
          classification: uncertainty
      - id: MR_PASSWORD_MANAGER
        prompt: Welche Aufgabe kann ein Passwortmanager beim Schutz vieler Konten übernehmen?
        options:
        - id: account_specific_store_use
          label: Für verschiedene Konten jeweils eigene Passwörter speichern und beim passenden Konto einsetzen.
          classification: correct
        - id: same_strong_everywhere
          label: Für verschiedene Konten dasselbe starke Passwort speichern und bei allen Konten einsetzen.
          classification: unsafe
        - id: auto_mfa
          label: Für verschiedene Konten MFA/2FA ohne weitere Einrichtung automatisch aktivieren.
          classification: incorrect_mechanism
        - id: unsure
          label: Weiß ich nicht.
          classification: uncertainty
      - id: MR_MFA
        prompt: Ein Angreifer kennt bereits das richtige Passwort eines Kontos. Was kann aktivierte MFA/2FA in dieser Situation
          bewirken?
        options:
        - id: additional_barrier
          label: Sie kann eine zusätzliche Anmeldebarriere bilden.
          classification: correct
        - id: reverses_exposure
          label: Sie verhindert nachträglich, dass das Passwort bekannt geworden ist.
          classification: incorrect_mechanism
        - id: reuse_safe
          label: Sie macht die Verwendung desselben Passworts bei anderen Konten sicher.
          classification: unsafe
        - id: unsure
          label: Weiß ich nicht.
          classification: uncertainty

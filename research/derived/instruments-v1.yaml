  follow-up-v1:
    participantTitle: Kurze Nachbefragung zur Studie
    estimatedMinutes: 1
    reportingWindow:
      startsAfterMainSession: true
      cutoff: first_invitation_at_iso
      instruction: Bitte beziehe dich ausschließlich auf Handlungen, die du nach deiner Studienteilnahme und bereits vor [STICHTAG]
        abgeschlossen hattest.
    safetyNote: Öffne oder ändere für diese Befragung keine Kontoeinstellungen. Bitte nenne keine Konten, Dienste, Passwörter,
      Anmeldecodes oder Wiederherstellungsdaten.
    items:
    - id: FU_PM_ACTIONS
      type: multiChoice
      prompt: Welche der folgenden Handlungen hattest du bis zu diesem Zeitpunkt tatsächlich durchgeführt?
      note: In Browsern oder Geräten integrierte und separat installierte Passwortmanager zählen gleichermaßen. Mehrfachauswahl
        ist möglich.
      options:
      - id: inspected_available_manager
        label: Ich habe geprüft, welchen Passwortmanager ich bereits nutzen kann und wie ich darauf zugreife.
      - id: generated_stored_account_specific
        label: Ich habe einen Passwortmanager genutzt, um für mindestens ein Konto, das ich tatsächlich verwende, ein neues
          Passwort zu erzeugen und zu speichern, das nur für dieses Konto verwendet wird.
      - id: used_retrieval_or_autofill
        label: Ich habe einen bereits eingerichteten Passwortmanager bewusst zum Abrufen oder automatischen Ausfüllen eines
          gespeicherten Passworts verwendet.
      - id: reviewed_access_or_recovery
        label: Ich habe geprüft, wie ich auf meinen Passwortmanager auf einem neuen Gerät oder nach einem Zugangsproblem wieder
          zugreifen könnte.
      - id: none
        label: Keine dieser Handlungen.
      - id: unsure_no_answer
        label: Ich weiß es nicht mehr oder möchte keine Angabe machen.
      exclusiveOptions:
      - none
      - unsure_no_answer
    - id: FU_PM_NONE_REASON
      type: singleChoice
      displayWhen:

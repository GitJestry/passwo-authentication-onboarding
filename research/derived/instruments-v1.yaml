    blocks:
    - id: scenarios
      submitLocksBlock: true
      items:
      - id: SC_DISTINCT_PASSWORDS
        prompt: Eine Person richtet ein E-Mail-Konto und ein Shopping-Konto ein. Welche Passwortwahl entspricht
          den Empfehlungen für mehrere Online-Konten am besten?
        options:
        - id: own_strong_each
          label: Für jedes Konto ein eigenes starkes Passwort verwenden.
        - id: same_strong_both
          label: Bei beiden Konten dasselbe besonders starke Passwort verwenden.
        - id: unique_email_reuse_shopping
          label: Für das E-Mail-Konto ein eigenes Passwort verwenden und beim Shopping-Konto ein Passwort nutzen,
            das auch für andere Konten verwendet wird.
        - id: unsure
          label: Weiß ich nicht.
      - id: SC_PM_MANY_ACCOUNTS
        prompt: Eine Person möchte für viele Konten unterschiedliche Passwörter verwenden, kann sie aber nicht alle
          im Kopf behalten. Welche Vorgehensweise unterstützt dieses Ziel am direktesten?
        options:
        - id: pm_generate_store_organize
          label: Mit einem Passwort-Manager für die Konten starke Passwörter erzeugen sowie die Passwörter speichern
            und organisieren.
        - id: unique_important_reuse_others
          label: Nur für wichtige Konten eigene Passwörter verwenden und bei den übrigen dasselbe Passwort wiederverwenden.
        - id: one_strong_everywhere
          label: Ein besonders starkes Passwort festlegen und dieses anschließend bei allen Konten verwenden.
        - id: unsure
          label: Weiß ich nicht.
      - id: SC_LAYERED_PROTECTION
        prompt: Eine Person richtet den Schutz für ihr E-Mail-Konto und ein Shopping-Konto ein. Bei beiden Konten
          ist Multi-Faktor-Authentifizierung (MFA) verfügbar. Welche Konfiguration entspricht den Empfehlungen aus
          dem Lernangebot am besten?
        options:
        - id: unique_and_mfa
          label: Für jedes Konto ein eigenes starkes Passwort verwenden und bei beiden Konten MFA aktivieren.
        - id: unique_without_mfa
          label: Für jedes Konto ein eigenes starkes Passwort verwenden, aber MFA bei beiden Konten nicht aktivieren.
        - id: shared_strong_with_mfa
          label: Bei beiden Konten dasselbe starke Passwort verwenden und bei beiden Konten MFA aktivieren.
        - id: unsure
          label: Weiß ich nicht.
    - id: recognition
      submitLocksBlock: true
      items:
      - id: MR_DISTINCT_PASSWORDS
        prompt: Welche Aussage beschreibt die empfohlene Passwortverwendung bei mehreren Online-Konten?
        options:
        - id: own_strong_each
          label: Für jedes Konto ein eigenes starkes Passwort verwenden.
        - id: one_strong_all
          label: Dasselbe besonders starke Passwort bei allen Konten verwenden.
        - id: unique_important_reuse_others
          label: Nur für wichtige Konten eigene Passwörter verwenden und bei den übrigen dasselbe Passwort verwenden.
        - id: unsure
          label: Weiß ich nicht.
      - id: MR_PASSWORD_MANAGER
        prompt: Welche Aufgaben kann ein Passwort-Manager übernehmen?
        options:
        - id: generate_store_organize
          label: Er kann starke Passwörter erzeugen sowie Passwörter speichern und organisieren.
        - id: same_strong_everywhere
          label: Er kann die verschiedenen Kontopasswörter durch ein gemeinsames besonders starkes Passwort ersetzen.
        - id: auto_mfa
          label: Er kann bei allen gespeicherten Konten ohne weitere Schritte automatisch MFA einrichten.
        - id: unsure
          label: Weiß ich nicht.
      - id: MR_MFA
        prompt: Welche Aussage beschreibt Multi-Faktor-Authentifizierung (MFA) bei einer Anmeldung mit Passwort?
        options:
        - id: password_plus_other_category
          label: Zusätzlich zum Passwort wird mindestens ein weiterer Faktor aus einer anderen Kategorie verwendet.
        - id: two_passwords
          label: Bei der Anmeldung werden zwei unterschiedliche Passwörter nacheinander eingegeben.
        - id: long_password_factor
          label: Ein besonders langes Passwort gilt allein bereits als zusätzlicher Faktor.
        - id: unsure
          label: Weiß ich nicht.

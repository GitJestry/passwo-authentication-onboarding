procedures:
  eligibility:
    persisted: false
    items:
    - id: ELIG_AGE
      prompt: Ich bin mindestens 18 Jahre alt.
      requiredValue: true
    - id: ELIG_UNIVERSITY
      prompt: Ich bin derzeit Mitglied einer Hochschule.
      requiredValue: true
    - id: ELIG_GERMAN
      prompt: Ich kann deutschsprachige Lernmaterialien und Fragebogenfragen ausreichend verstehen.
      requiredValue: true
  participantInformation:
    source: docs/research/PARTICIPANT-INFORMATION.md
    eyebrow: Studie zu Passwörtern und dem Schutz von Online-Konten
    welcomeHeading: Willkommen
    welcomeParagraphs:
    - Vielen Dank, dass du dir Zeit für diese Studie nimmst. Du bearbeitest ein digitales Lernangebot zu Passwörtern
      und zum Schutz von Online-Konten und beantwortest davor und danach einige Fragen.
    readMoreLabel: Ausführliche Teilnahmeinformationen
    informationHeading: Informationen zu deiner Teilnahme
    sections:
    - id: purpose
      heading: Worum geht es und was erwartet dich?
      paragraphs:
      - Wir untersuchen, wie ein digitales Lernangebot zu Passwörtern und zum Schutz von Online-Konten genutzt,
        wahrgenommen und verstanden wird.
      - Zunächst beantwortest du einige Fragen zu deiner Person und deinen bisherigen Erfahrungen. Danach bearbeitest
        du das Lernangebot. Abschließend folgen Fragen zu deiner Wahrnehmung und zu den vermittelten Inhalten. Die
        heutige Teilnahme dauert etwa 30 Minuten.
      - Einige Details zur genauen Fragestellung erläutern wir am Ende der heutigen Befragung, damit sie deine
        Bearbeitung nicht vorab beeinflussen.
    - id: data
      heading: Welche Daten werden verarbeitet?
      paragraphs:
      - Gespeichert werden deine Fragebogenantworten und technische Angaben zum Studienablauf, etwa Bearbeitungszeiten
        und Abschlussstatus.
      - Es werden keine realen Passwörter, Kontonamen, Sicherheitscodes oder Zugangsdaten erhoben. Fiktive Passwörter
        aus dem Lernangebot werden weder gespeichert noch übertragen.
      - Die Forschungsdaten werden unter einer zufälligen Studien-ID gespeichert. Name und E-Mail-Adresse stehen nicht
        im Forschungsdatensatz. Zugriff erhalten nur die für Durchführung, Auswertung und Aufbewahrung zuständigen
        Personen an der Universität Bonn.
    - id: follow_up
      heading: Freiwillige Nachbefragung und E-Mail-Adresse
      paragraphs:
      - Du kannst freiwillig eine E-Mail-Adresse angeben. Dann erhältst du ungefähr zehn Tage später eine Einladung
        zu einer etwa zweiminütigen Nachbefragung und gegebenenfalls eine einmalige Erinnerung.
      - Die E-Mail-Adresse wird getrennt von den Forschungsdaten gespeichert und ausschließlich für diese Kontaktaufnahme
        verwendet. Sie wird nach dem letzten vorgesehenen Versand, spätestens mit Abschluss der Nachbefragung, gelöscht.
      - Die Angabe einer E-Mail-Adresse und die Teilnahme an der Nachbefragung sind keine Voraussetzungen für die
        heutige Studie.
    - id: storage
      heading: Pseudonymisierung, Anonymisierung und Aufbewahrung
      paragraphs:
      - Die Forschungsdaten bleiben bis zum Abschluss der Datenauswertung und der abschließenden Prüfung des Datensatzes
        pseudonymisiert. Bis dahin kannst du mit deinem Löschcode die Löschung deiner zuordenbaren Forschungsdaten
        verlangen.
      - Anschließend werden alle Zuordnungsinformationen dauerhaft gelöscht und der verbleibende Forschungsdatensatz
        anonymisiert. Danach kann er keiner einzelnen Person mehr zugeordnet oder auf individuellen Wunsch gelöscht
        werden.
      - Der anonymisierte Forschungsdatensatz wird universitätsseitig zehn Jahre aufbewahrt und anschließend gelöscht.
    - id: voluntariness
      heading: Freiwilligkeit, Widerruf und deine Rechte
      paragraphs:
      - Die Teilnahme ist freiwillig. Du kannst sie jederzeit ohne Begründung und ohne Nachteile beenden. Ein Abbruch
        beendet die weitere Datenerhebung.
      - Du kannst deine Einwilligung jederzeit mit Wirkung für die Zukunft widerrufen. Die Rechtmäßigkeit der bis dahin
        erfolgten Verarbeitung bleibt davon unberührt. Bis zur Anonymisierung kannst du unter Angabe deines Löschcodes
        die Löschung deiner Forschungsdaten bei Julian Meyer unter s27jmeye@uni-bonn.de verlangen.
      - Die Verarbeitung beruht auf deiner freiwilligen Einwilligung gemäß Art. 6 Abs. 1 lit. a DSGVO. Im Rahmen der
        gesetzlichen Voraussetzungen hast du insbesondere Rechte auf Auskunft, Berichtigung, Löschung, Einschränkung
        der Verarbeitung und Datenübertragbarkeit sowie ein Beschwerderecht bei einer Datenschutzaufsichtsbehörde.
    - id: burden
      heading: Mögliche Belastungen und Nutzen
      paragraphs:
      - Es sind keine besonderen Risiken zu erwarten, die über alltägliche Belastungen bei der Nutzung digitaler
        Lernangebote und Fragebögen hinausgehen. Ein unmittelbarer persönlicher Nutzen kann nicht zugesichert werden.
    - id: contact
      heading: Verantwortliche und Kontakt
      paragraphs:
      - Verantwortlich für die Studie sind Julian Meyer und Christian Tiefenau.
      - 'Kontakt zur Studie: Julian Meyer, s27jmeye@uni-bonn.de; Christian Tiefenau, tiefenau@cs.uni-bonn.de.'
      - 'Datenschutzkontakt: datenschutz@uni-bonn.de.'
    requiredConsent:
      legend: Einwilligung in die Hauptstudie
      statement: Ich habe die Teilnahmeinformationen gelesen und verstanden. Ich willige freiwillig in die Teilnahme
        und in die beschriebene pseudonymisierte Verarbeitung meiner Forschungsdaten ein.
    actions:
      acceptLabel: Teilnahme beginnen
      declineLabel: Nicht teilnehmen
      declineHeading: Danke für deine Rückmeldung
      declineBody: Du nimmst nicht an der Studie teil. Es wurde keine Sitzung angelegt.
    essentialSummaryHeading: Das Wichtigste zur Teilnahme
    essentialSummaryParagraphs:
    - 'Dauer: Die heutige Teilnahme dauert etwa 30 Minuten.'
    - 'Freiwilligkeit: Du kannst die Teilnahme jederzeit ohne Begründung und ohne Nachteile beenden.'
    - 'Datenschutz: Deine Angaben werden zunächst unter einer zufälligen Studien-ID ausgewertet. Reale Passwörter
      oder Zugangsdaten werden nicht abgefragt; fiktive Passwörter werden nicht gespeichert oder übertragen.'
    - 'Optionale Nachbefragung: Du kannst freiwillig eine E-Mail-Adresse angeben und ungefähr zehn Tage später an
      einer etwa zweiminütigen Nachbefragung teilnehmen.'
  followUpRecontact:
    optional: true
    consentLegend: Optionale Nachbefragung
    consentStatement: Ich möchte ungefähr zehn Tage später per E-Mail zu einer freiwilligen, etwa zweiminütigen
      Nachbefragung eingeladen werden. Ich willige ein, dass meine E-Mail-Adresse getrennt von den Forschungsdaten
      gespeichert und ausschließlich für die Einladung und höchstens eine Erinnerung verwendet wird. Sie wird nach
      dem letzten vorgesehenen Versand, spätestens mit Abschluss der Nachbefragung, gelöscht. Diese Zustimmung ist
      freiwillig und keine Voraussetzung für die heutige Studienteilnahme.
    emailLabel: E-Mail-Adresse für die freiwillige Nachbefragung
    emailRequired: true
    emailNeverStoredInResearchDatabase: true
    firstInvitationDelayHours: 240
    reminderDelayAfterFirstInvitationHours: 48
    closeAfterSessionHours: 336
    emailSubject: Freiwillige Nachbefragung zur Studie
    emailContainsTrainingAdvice: false
  sessionClosure:
    withoutFollowUp:
      heading: Aufklärung zur Studie
      paragraphs:
      - Diese Studie vergleicht zwei unterschiedliche digitale Trainingsangebote zu Passwörtern und zum Schutz von
        Online-Konten. Untersucht wird, wie die beiden Angebote wahrgenommen werden und ob zentrale Zusammenhänge
        zu Passwortwiederverwendung, Passwortmanagern und MFA/2FA erkannt und auf Kontosituationen angewendet werden.
      - Die Information über den Vergleich wurde zu Beginn noch nicht offengelegt, damit Erwartungen an die beiden
        Angebote die Bearbeitung und die unmittelbaren Bewertungen möglichst wenig beeinflussen.
      - 'Die zentralen Empfehlungen lauten: Für jedes Online-Konto sollte ein eigenes starkes Passwort verwendet
        werden. Ein Passwortmanager kann starke Passwörter erzeugen, speichern und organisieren. Bei einer passwortbasierten
        Anmeldung ergänzt MFA/2FA das Passwort um mindestens einen weiteren Faktor aus einer anderen Kategorie.'
      - Dasselbe starke Passwort bei mehreren Konten zu verwenden, entspricht auch bei aktivierter MFA/2FA nicht
        der Empfehlung. Das gemeinsame Debriefing zeigt keine persönliche Punktzahl und bewertet dich nicht als
        bestanden oder nicht bestanden.
      - Du hast keine E-Mail-Adresse für die freiwillige Nachbefragung hinterlegt. Deine heutige Teilnahme ist damit
        vollständig abgeschlossen.
      actionLabel: Sitzung abschließen
    withFollowUp:
      heading: Aufklärung zur Studie
      paragraphs:
      - Diese Studie vergleicht zwei unterschiedliche digitale Trainingsangebote zu Passwörtern und zum Schutz von
        Online-Konten. Untersucht wird, wie die beiden Angebote wahrgenommen werden und ob zentrale Zusammenhänge
        zu Passwortwiederverwendung, Passwortmanagern und MFA/2FA erkannt und auf Kontosituationen angewendet werden.
      - Die Information über den Vergleich wurde zu Beginn noch nicht offengelegt, damit Erwartungen an die beiden
        Angebote die Bearbeitung und die unmittelbaren Bewertungen möglichst wenig beeinflussen.
      - 'Die zentralen Empfehlungen lauten: Für jedes Online-Konto sollte ein eigenes starkes Passwort verwendet
        werden. Ein Passwortmanager kann starke Passwörter erzeugen, speichern und organisieren. Bei einer passwortbasierten
        Anmeldung ergänzt MFA/2FA das Passwort um mindestens einen weiteren Faktor aus einer anderen Kategorie.'
      - Dasselbe starke Passwort bei mehreren Konten zu verwenden, entspricht auch bei aktivierter MFA/2FA nicht
        der Empfehlung. Das gemeinsame Debriefing zeigt keine persönliche Punktzahl und bewertet dich nicht als
        bestanden oder nicht bestanden.
      - Da du freiwillig eine E-Mail-Adresse hinterlegt hast, erhältst du ungefähr zehn Tage nach der heutigen Teilnahme
        eine Einladung zur kurzen Nachbefragung. Ob du sie dann ausfüllst, entscheidest du erneut freiwillig.
      actionLabel: Sitzung abschließen
instruments:
  pre-v1:
    sections:
    - id: sample
      items:
      - id: PRE_ROLE
        type: singleChoice
        prompt: Welche Rolle beschreibt deine überwiegende Tätigkeit an der Hochschule am besten?
        options:
        - id: undergraduate
          label: Bachelor, Staatsexamen oder anderes grundständiges Studium
        - id: graduate
          label: Master oder anderes weiterführendes Studium
        - id: doctoral
          label: Promotion, auch bei gleichzeitiger Beschäftigung
        - id: academic_teaching
          label: Wissenschaft oder Lehre ohne Promotion
        - id: technical_admin_service
          label: Technik, Verwaltung oder Service
        - id: other_university
          label: Anderer Hochschulbereich
        - id: no_answer
          label: Keine Angabe
      - id: PRE_FIELD
        type: singleChoice
        prompt: Welchem Bereich bist du überwiegend zugeordnet?
        options:
        - id: stem
          label: Mathematik, Informatik, Naturwissenschaften oder Technik
        - id: medicine_life_sciences
          label: Medizin, Gesundheit oder Lebenswissenschaften
        - id: law_economics
          label: Rechts- oder Wirtschaftswissenschaften
        - id: social_behavioral
          label: Sozial- oder Verhaltenswissenschaften
        - id: humanities_culture_languages
          label: Geistes-, Kultur- oder Sprachwissenschaften
        - id: administration_service_no_field
          label: Zentrale Einrichtung, Verwaltung oder keinem Fachbereich zugeordnet
        - id: other
          label: Anderer Bereich
        - id: no_answer
          label: Keine Angabe
      - id: PRE_AGE
        type: singleChoice
        prompt: Zu welcher Altersgruppe gehörst du?
        options:
        - id: age_18_25
          label: 18–25 Jahre
        - id: age_26_35
          label: 26–35 Jahre
        - id: age_36_45
          label: 36–45 Jahre
        - id: age_46_55
          label: 46–55 Jahre
        - id: age_56_65
          label: 56–65 Jahre
        - id: age_66_plus
          label: 66 Jahre oder älter
        - id: no_answer
          label: Keine Angabe
    - id: experience
      items:
      - id: PRE_TRAINING
        type: singleChoice
        prompt: Wie oft hast du bereits ein Training oder Lernmodul zu Passwörtern, Passwortmanagern oder MFA/2FA
          bearbeitet?
        options:
        - id: never
          label: Nie
        - id: once
          label: Einmal
        - id: multiple
          label: Mehrmals
        - id: unsure
          label: Unsicher
      - id: PRE_PM_USE
        type: multiChoice
        prompt: Welche Möglichkeiten nutzt du aktuell, um Passwörter zu speichern oder beim Anmelden einzusetzen?
        instruction: Mehrfachauswahl ist möglich.
        options:
        - id: browser_or_device_integrated
          label: Die im Browser, Betriebssystem oder Gerät integrierte Funktion verwenden, um Passwörter zu speichern
            oder automatisch ausfüllen zu lassen.
        - id: separate_app_or_extension
          label: Eine separate Passwortmanager-App oder deren Browser-Erweiterung verwenden.
        - id: none
          label: Keine dieser Möglichkeiten.
        - id: unsure
          label: Unsicher.
        exclusiveOptions:
        - none
        - unsure
      - id: PRE_MFA_USE
        type: singleChoice
        prompt: Bei wie vielen Konten, die dir persönlich wichtig sind, ist nach deinem Wissen eine Mehrfaktor-
          oder Zwei-Faktor-Authentifizierung (MFA/2FA) aktiviert?
        options:
        - id: none
          label: Bei keinem.
        - id: few
          label: Bei wenigen.
        - id: about_half
          label: Bei etwa der Hälfte.
        - id: most
          label: Bei den meisten.
        - id: all
          label: Bei allen.
        - id: unsure
          label: Unsicher.
  post-v1:
    order:
    - panas
    - duration
    - ueqs
    - content_trustworthiness
    - design_diagnostics
    - risk_understanding
    - self_efficacy
    - secaware_prior_exposure
    sections:
    - id: panas
      source: German PANAS, documented item wording and order
      preserveItemOrder: true
      instruction: Dieser Fragebogen enthält eine Reihe von Wörtern, die unterschiedliche Gefühle und Empfindungen
        beschreiben. Lesen Sie jedes Wort und tragen Sie dann in die Skala neben jedem Wort die Intensität ein.
        Sie haben die Möglichkeit, zwischen fünf Abstufungen zu wählen. Geben Sie bitte an, wie Sie sich während
        der Bearbeitung des Lernangebots gefühlt haben.
      items:
      - id: PANAS_01
        type: scale
        scale: panasIntensity5
        label: aktiv
      - id: PANAS_02
        type: scale
        scale: panasIntensity5
        label: bekümmert
      - id: PANAS_03
        type: scale
        scale: panasIntensity5
        label: interessiert
      - id: PANAS_04
        type: scale
        scale: panasIntensity5
        label: freudig erregt
      - id: PANAS_05
        type: scale
        scale: panasIntensity5
        label: verärgert
      - id: PANAS_06
        type: scale
        scale: panasIntensity5
        label: stark
      - id: PANAS_07
        type: scale
        scale: panasIntensity5
        label: schuldig
      - id: PANAS_08
        type: scale
        scale: panasIntensity5
        label: erschrocken
      - id: PANAS_09
        type: scale
        scale: panasIntensity5
        label: feindselig
      - id: PANAS_10
        type: scale
        scale: panasIntensity5
        label: angeregt
      - id: PANAS_11
        type: scale
        scale: panasIntensity5
        label: stolz
      - id: PANAS_12
        type: scale
        scale: panasIntensity5
        label: gereizt
      - id: PANAS_13
        type: scale
        scale: panasIntensity5
        label: begeistert
      - id: PANAS_14
        type: scale
        scale: panasIntensity5
        label: beschämt
      - id: PANAS_15
        type: scale
        scale: panasIntensity5
        label: wach
      - id: PANAS_16
        type: scale
        scale: panasIntensity5
        label: nervös
      - id: PANAS_17
        type: scale
        scale: panasIntensity5
        label: entschlossen
      - id: PANAS_18
        type: scale
        scale: panasIntensity5
        label: aufmerksam
      - id: PANAS_19
        type: scale
        scale: panasIntensity5
        label: durcheinander
      - id: PANAS_20
        type: scale
        scale: panasIntensity5
        label: ängstlich
    - id: duration
      objectiveDurationHiddenUntilSectionCommitted: true
      items:
      - id: PERCEIVED_DURATION
        type: scale
        scale: perceivedDuration7
        prompt: Wie lang kam dir die Bearbeitung des Lernangebots insgesamt vor?
      - id: TIME_FIT
        type: scale
        scale: durationAppropriateness7
        prompt: Wie passend war die Dauer des Lernangebots für dich?
    - id: ueqs
      source: UEQ-S official German items
      preserveItemOrder: true
      instruction: Bitte bewerte deinen unmittelbaren Gesamteindruck des gerade bearbeiteten Lernangebots. Markiere
        jeweils eine Position zwischen den beiden Begriffen.
      items:
      - id: UEQS_PQ1
        type: semanticDifferential
        scale: ueqSemanticDifferential7
        left: behindernd
        right: unterstützend
      - id: UEQS_PQ2
        type: semanticDifferential
        scale: ueqSemanticDifferential7
        left: kompliziert
        right: einfach
      - id: UEQS_PQ3
        type: semanticDifferential
        scale: ueqSemanticDifferential7
        left: ineffizient
        right: effizient
      - id: UEQS_PQ4
        type: semanticDifferential
        scale: ueqSemanticDifferential7
        left: verwirrend
        right: übersichtlich
      - id: UEQS_HQ1
        type: semanticDifferential
        scale: ueqSemanticDifferential7
        left: langweilig
        right: spannend
      - id: UEQS_HQ2
        type: semanticDifferential
        scale: ueqSemanticDifferential7
        left: uninteressant
        right: interessant
      - id: UEQS_HQ3
        type: semanticDifferential
        scale: ueqSemanticDifferential7
        left: konventionell
        right: originell
      - id: UEQS_HQ4
        type: semanticDifferential
        scale: ueqSemanticDifferential7
        left: herkömmlich
        right: neuartig
    - id: content_trustworthiness
      source: UEQ+ Trustworthiness of Content, official German items
      preserveItemOrder: true
      instruction: 'Die Informationen und Daten, die mir das Lernangebot bereitstellt, sind:'
      items:
      - id: UEQP_TOC1
        type: semanticDifferential
        scale: ueqSemanticDifferential7
        left: nutzlos
        right: nützlich
      - id: UEQP_TOC2
        type: semanticDifferential
        scale: ueqSemanticDifferential7
        left: unglaubwürdig
        right: glaubwürdig
      - id: UEQP_TOC3
        type: semanticDifferential
        scale: ueqSemanticDifferential7
        left: unseriös
        right: seriös
      - id: UEQP_TOC4
        type: semanticDifferential
        scale: ueqSemanticDifferential7
        left: ungenau
        right: genau
    - id: design_diagnostics
      items:
      - id: USEFULNESS_PRACTICAL
        type: scale
        scale: agreement7
        prompt: Die Inhalte waren nützlich, um Entscheidungen zum Schutz meiner Konten zu treffen.
      - id: APPROACH_FRAMING
        type: scale
        scale: agreement7
        prompt: Das Lernangebot stellte in den Vordergrund, was ich zum Schutz meiner Konten tun kann.
      - id: NONBLAMING_COMMUNICATION
        type: scale
        scale: agreement7
        prompt: Die Sicherheitsempfehlungen wurden ohne persönliche Vorwürfe vermittelt.
      - id: PERSONAL_RELEVANCE
        type: scale
        scale: agreement7
        prompt: Die Beispiele machten deutlich, warum die Inhalte für Konten relevant sind, die ich im Alltag nutze.
      - id: APPLICATION_OPPORTUNITY
        type: scale
        scale: agreement7
        prompt: Das Lernangebot gab mir Gelegenheit, die Inhalte auf konkrete Kontosituationen anzuwenden.
      - id: REFLECTIVE_ENGAGEMENT
        type: scale
        scale: agreement7
        prompt: Das Lernangebot brachte mich dazu, selbst über die Gründe für unterschiedliche Entscheidungen zum
          Schutz von Konten nachzudenken.
      - id: MECHANISM_EXPLANATION
        type: scale
        scale: agreement7
        prompt: Die Erklärungen machten nachvollziehbar, wie die empfohlenen Maßnahmen zum Schutz von Konten beitragen.
      - id: CONSEQUENCE_RISK
        type: scale
        scale: agreement7
        prompt: Das Lernangebot machte mögliche negative Folgen unterschiedlicher Entscheidungen zum Schutz von
          Konten für mich konkret vorstellbar.
      - id: CONSEQUENCE_PROTECTION
        type: scale
        scale: agreement7
        prompt: Das Lernangebot machte für mich konkret vorstellbar, wie geeignete Entscheidungen zum Schutz von
          Konten mögliche Schäden begrenzen können.
      - id: INFORMATION_MANAGEABILITY
        type: scale
        scale: agreement7
        prompt: Die Informationsmenge war für mich gut zu bewältigen.

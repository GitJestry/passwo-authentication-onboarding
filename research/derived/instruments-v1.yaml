language: de-DE
participantTerm: Lernangebot
scales:
  agreement7:
    type: integer
    min: 1
    max: 7
    anchors:
      '1': stimme überhaupt nicht zu
      '2': stimme nicht zu
      '3': stimme eher nicht zu
      '4': weder noch
      '5': stimme eher zu
      '6': stimme zu
      '7': stimme vollständig zu
  confidence11:
    type: integer
    min: 0
    max: 10
    anchors:
      '0': überhaupt nicht zuversichtlich
      '5': mäßig zuversichtlich
      '10': völlig zuversichtlich
  panasIntensity5:
    type: integer
    min: 1
    max: 5
    anchors:
      '1': gar nicht
      '2': ein bisschen
      '3': einigermaßen
      '4': erheblich
      '5': äußerst
  durationAppropriateness7:
    type: integer
    min: 1
    max: 7
    anchors:
      '1': deutlich zu kurz
      '2': zu kurz
      '3': eher zu kurz
      '4': genau richtig
      '5': eher zu lang
      '6': zu lang
      '7': deutlich zu lang
  perceivedDuration7:
    type: integer
    min: 1
    max: 7
    anchors:
      '1': sehr kurz
      '2': kurz
      '3': eher kurz
      '4': weder kurz noch lang
      '5': eher lang
      '6': lang
      '7': sehr lang
  ueqSemanticDifferential7:
    type: integer
    min: 1
    max: 7
    derivedTransform: value - 4
  riskPresentation7:
    type: integer
    min: 1
    max: 7
    anchors:
      '1': deutlich verharmlost
      '2': verharmlost
      '3': eher verharmlost
      '4': angemessen
      '5': eher übertrieben
      '6': übertrieben
      '7': deutlich übertrieben

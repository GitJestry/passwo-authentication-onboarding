schemaVersion: 2
# Kanonische Forschungsquelle; die Browserprojektion liegt zusätzlich unter packages/contracts.
instrumentVersion: 1.5.0-draft
questionnaireVersion: questionnaire-v1.3-draft
guardrailVersion: guardrail-v2-draft
consentVersion: consent-v3-draft
followUpVersion: follow-up-v1-draft
language: de-DE
participantTerm: Lernangebot
scales:
  agreement7:
    type: integer
    min: 1
    max: 7
    anchors:
      1: stimme überhaupt nicht zu
      2: stimme nicht zu
      3: stimme eher nicht zu
      4: weder noch
      5: stimme eher zu
      6: stimme zu
      7: stimme vollständig zu
  confidence11:
    type: integer
    min: 0
    max: 10
    anchors:
      0: überhaupt nicht sicher
      5: mäßig sicher
      10: vollständig sicher
  familiarity5:
    type: integer
    min: 1
    max: 5
    anchors:
      1: gar nicht vertraut
      2: wenig vertraut
      3: teilweise vertraut
      4: ziemlich vertraut
      5: sehr vertraut
  intensity5:
    type: integer
    min: 1
    max: 5
    anchors:
      1: gar nicht
      2: wenig
      3: mittel
      4: stark
      5: sehr stark
  durationAppropriateness7:
    type: integer
    min: 1
    max: 7
    anchors:
      1: viel zu kurz
      4: genau richtig
      7: viel zu lang
  ueqSemanticDifferential7:
    type: integer
    min: 1
    max: 7
    derivedTransform: value - 4
analysis:
  selfEfficacy:
    aggregateScore: false
    scale: confidence11
    topics:
      passwordManagement:
        preItemId: SE_PASSWORDS_PRE
        postItemId: SE_PASSWORDS_POST
      passwordManagerUse:
        preItemId: SE_PM_PRE
        postItemId: SE_PM_POST
      mfaActivation:
        preItemId: SE_MFA_PRE
        postItemId: SE_MFA_POST
  familiarity:
    aggregateScore: false
  emotionProfile:
    aggregateScore: false
procedures:
  eligibility:
    persisted: false
    items:
    - id: ELIG_AGE
      prompt: Ich bin mindestens 18 Jahre alt.
      requiredValue: true
    - id: ELIG_UNIVERSITY
      prompt: Ich bin derzeit Mitglied einer Hochschule.
      requiredValue: true
    - id: ELIG_GERMAN
      prompt: Ich kann deutschsprachige Lernmaterialien und Fragebogenfragen sicher verstehen.
      requiredValue: true
  participantInformation:
    source: docs/research/PARTICIPANT-INFORMATION.md
    eyebrow: Studie zu digitalem Kontoschutz
    welcomeHeading: Willkommen
    welcomeParagraphs:
    - Vielen Dank, dass du dir Zeit für diese Studie nimmst. Du bearbeitest gleich ein digitales Lernangebot zum Schutz
      von Online-Konten. Davor und danach beantwortest du einige kurze Fragen.
    - Plane für die heutige Sitzung etwa 20 bis 30 Minuten ein. Die Teilnahme ist freiwillig und kann jederzeit ohne
      Nachteile beendet werden.
    facts:
    - id: duration
      label: Dauer heute
      value: etwa 20–30 Minuten
    - id: analysis
      label: Auswertung
      value: pseudonymisiert
    - id: follow_up
      label: Nachbefragung
      value: optional, etwa 1 Minute nach 10 Tagen
    readMoreLabel: Teilnahmeinformationen lesen
    informationHeading: Informationen zu deiner Teilnahme
    sections:
    - id: purpose
      heading: Worum geht es?
      paragraphs:
      - Wir untersuchen, wie ein digitales Lernangebot zum Schutz von Online-Konten genutzt und wahrgenommen wird. Einige
        Einzelheiten dazu, was genau untersucht wird, erläutern wir erst nach deinem letzten Studienteil. Dadurch soll
        vermieden werden, dass Vorwissen über die genaue Fragestellung deine Bearbeitung beeinflusst.
    - id: procedure
      heading: Was erwartet dich?
      paragraphs:
      - Zunächst beantwortest du kurze Fragen zu deiner Person und zu bisherigen Erfahrungen mit den behandelten Themen.
        Danach bearbeitest du ein digitales Lernangebot. Abschließend folgen Fragen zu deiner Wahrnehmung des Angebots und
        zu den vermittelten Inhalten. Die heutige Sitzung dauert voraussichtlich 20 bis 30 Minuten.
      - Optional kannst du etwa zehn Tage später per E-Mail an einer ungefähr einminütigen Nachbefragung teilnehmen. Die
        Hauptstudie kann vollständig bearbeitet werden, ohne dieser Kontaktaufnahme zuzustimmen.
    - id: data
      heading: Welche Daten werden verarbeitet?
      paragraphs:
      - Gespeichert werden deine Fragebogenantworten, Bearbeitungszeiten, technische Abschlussinformationen und Angaben
        zum bearbeiteten Studienablauf. Die Forschungsdaten werden unter einem zufällig erzeugten Teilnehmercode
        pseudonymisiert gespeichert und ausgewertet. Sie enthalten weder deinen Namen noch deine E-Mail-Adresse.
      - Falls du der Nachbefragung zustimmst, wird deine E-Mail-Adresse getrennt von den Forschungsdaten gespeichert und
        ausschließlich für die Einladung sowie höchstens eine Erinnerung verwendet.
    - id: voluntariness
      heading: Freiwilligkeit und Abbruch
      paragraphs:
      - Die Teilnahme ist freiwillig. Du kannst sie jederzeit ohne Begründung und ohne Nachteile beenden. Innerhalb der
        vor dem Study Freeze festgelegten Aufbewahrungs- und Löschfrist kannst du unter Angabe deines Teilnehmercodes die
        Löschung deiner Forschungsdaten verlangen.
    - id: burden
      heading: Mögliche Belastungen und Nutzen
      paragraphs:
      - Es sind keine besonderen Risiken zu erwarten, die über alltägliche Belastungen bei der Nutzung digitaler
        Lernangebote und Fragebögen hinausgehen. Ein unmittelbarer persönlicher Nutzen kann nicht zugesichert werden.
    - id: contact
      heading: Fragen und Kontakt
      paragraphs:
      - "Bei Fragen zur Studie, zur Teilnahme oder zur Verarbeitung deiner Daten kannst du dich an folgende Stelle wenden:"
      - "Studienleitung: Julian Meyer, s27jmeye@uni-bonn.de"
      - "Betreuung: Dr. Christian Tiefenau, tiefenau@cs.uni-bonn.de"
      - "Verantwortliche Stelle / Datenschutzkontakt: [nach Vorgabe der Universität ergänzen]"
    requiredConsent:
      legend: Einwilligung
      statement: Ich habe die Teilnahmeinformationen gelesen und verstanden. Ich weiß, dass einige Einzelheiten zur
        genauen Fragestellung erst nach meinem letzten Studienteil erläutert werden. Ich willige freiwillig in die
        Teilnahme und in die beschriebene pseudonymisierte Verarbeitung meiner Forschungsdaten ein.
    actions:
      acceptLabel: Teilnahme beginnen
      declineLabel: Nicht teilnehmen
      declineHeading: Danke für deine Rückmeldung
      declineBody: Du nimmst nicht an der Studie teil. Es wurde keine Sitzung angelegt.
  followUpRecontact:
    optional: true
    consentLegend: Optionale Nachbefragung
    consentStatement: Ich möchte etwa zehn Tage später per E-Mail zu einer kurzen Nachbefragung eingeladen werden. Meine
      E-Mail-Adresse wird getrennt von den Forschungsdaten gespeichert und nur für diese Kontaktaufnahme verwendet.
    emailLabel: E-Mail-Adresse für die Nachbefragung
    emailRequired: true
    emailNeverStoredInResearchDatabase: true
    firstInvitationDelayHours: 240
    reminderDelayAfterFirstInvitationHours: 48
    closeAfterSessionHours: 336
    emailSubject: Kurze Nachbefragung zur Studie
    emailContainsTrainingAdvice: false
  sessionClosure:
    immediateDebriefWithoutFollowUp:
      heading: Aufklärung zur Studie
      paragraphs:
      - Zu Beginn wurden nicht alle Einzelheiten des Studiendesigns offengelegt. In der Studie werden zwei
        deutschsprachige Lernangebote zum Schutz von Online-Konten als vollständige Angebote miteinander verglichen. Die
        Zuweisung erfolgte zufällig. Diese Information wurde zunächst zurückgehalten, damit Erwartungen an einen Vergleich
        die Bearbeitung und Bewertung des jeweiligen Lernangebots möglichst wenig beeinflussen.
      - Untersucht werden insbesondere die Wahrnehmung des Lernangebots, die Bearbeitungsdauer sowie das unmittelbare
        Verständnis zentraler Aussagen zu Passwortwiederverwendung, Passwortmanagern und MFA/2FA. Die Studie prüft nicht,
        ob eine einzelne Gestaltungskomponente oder ein einzelnes psychologisches Prinzip die Ergebnisse verursacht hat.
      - Du kannst nach dieser Aufklärung innerhalb der vor dem Study Freeze festgelegten Aufbewahrungs- und Löschfrist
        weiterhin die Löschung deiner Forschungsdaten verlangen. Verwende dafür deinen Teilnehmercode und die angegebene
        Kontaktadresse.
      actionLabel: Abschluss bestätigen
    deferredDebriefWithFollowUp:
      heading: Vielen Dank für deine Teilnahme
      paragraphs:
      - Die Hauptsitzung ist damit abgeschlossen. Zehn Tage nach deiner Teilnahme erhältst du die kurze Nachbefragung an
        die angegebene E-Mail-Adresse.
      - Die vollständige Aufklärung zur Studie erhältst du nach deiner Antwort oder spätestens nach Schließung des
        Follow-up-Zeitfensters. Du kannst dieses Fenster jetzt schließen.
      actionLabel: Abschluss bestätigen
instruments:
  pre-v1:
    sections:
    - id: sample
      items:
      - id: PRE_ROLE
        type: singleChoice
        prompt: Welche Rolle beschreibt deine derzeitige Hochschulzugehörigkeit am besten?
        options:
        - id: undergraduate
          label: Bachelor, Staatsexamen oder anderes grundständiges Studium
        - id: graduate
          label: Master oder anderes weiterführendes Studium
        - id: doctoral
          label: Promotion
        - id: academic_teaching
          label: Wissenschaft oder Lehre
        - id: technical_admin_service
          label: Technik, Verwaltung oder Service
        - id: other_university
          label: Anderer Hochschulbereich
        - id: no_answer
          label: Keine Angabe
      - id: PRE_FIELD
        type: singleChoice
        prompt: Welchem Bereich bist du überwiegend zugeordnet?
        options:
        - id: stem
          label: Mathematik, Informatik, Naturwissenschaften oder Technik
        - id: medicine_life_sciences
          label: Medizin, Gesundheit oder Lebenswissenschaften
        - id: law_economics
          label: Rechts- oder Wirtschaftswissenschaften
        - id: social_behavioral
          label: Sozial- oder Verhaltenswissenschaften
        - id: humanities_culture_languages
          label: Geistes-, Kultur- oder Sprachwissenschaften
        - id: administration_service_no_field
          label: Technik, Verwaltung, Service oder keinem Fachbereich zugeordnet
        - id: other
          label: Anderer Bereich
        - id: no_answer
          label: Keine Angabe
      - id: PRE_AGE
        type: singleChoice
        prompt: Zu welcher Altersgruppe gehörst du?
        options:
        - id: age_18_25
          label: 18–25 Jahre
        - id: age_26_35
          label: 26–35 Jahre
        - id: age_36_45
          label: 36–45 Jahre
        - id: age_46_55
          label: 46–55 Jahre
        - id: age_56_65
          label: 56–65 Jahre
        - id: age_66_plus
          label: 66 Jahre oder älter
        - id: no_answer
          label: Keine Angabe
      - id: PRE_GENDER
        type: singleChoice
        participantOptional: true
        prompt: Wie beschreibst du dein Geschlecht?
        options:
        - id: female
          label: Weiblich
        - id: male
          label: Männlich
        - id: nonbinary_diverse
          label: Nichtbinär oder divers
        - id: another_identity
          label: Eine andere Geschlechtsidentität
        - id: no_answer
          label: Keine Angabe
    - id: experience
      items:
      - id: PRE_SECAWARE
        type: singleChoice
        prompt: Wie vertraut bist du bereits mit SecAware.NRW?
        options:
        - id: never_heard
          label: Noch nie davon gehört
        - id: heard_not_used
          label: Davon gehört, aber nicht genutzt
        - id: viewed_or_started
          label: Kurz angesehen oder ein Modul begonnen
        - id: completed_password_auth_module
          label: Das Modul „Passwörter & Authentifizierung“ vollständig bearbeitet
        - id: unsure
          label: Unsicher
        analysisFlag:
          completed_password_auth_module: exclude_primary_sample
      - id: PRE_TRAINING
        type: singleChoice
        prompt: Wie oft hast du bereits ein Training oder Lernmodul zu Passwörtern, Passwortmanagern oder MFA/2FA bearbeitet?
        options:
        - id: never
          label: Nie
        - id: once
          label: Einmal
        - id: multiple
          label: Mehrmals
        - id: unsure
          label: Unsicher
      - id: PRE_PM_USE
        type: multiChoice
        prompt: Welche der folgenden Funktionen nutzt du aktuell, um Passwörter zu speichern oder beim Anmelden auszufüllen?
        instruction: Mehrfachauswahl ist möglich.
        options:
        - id: browser_or_device_integrated
          label: Im Browser oder Gerät integrierte Passwortspeicherung beziehungsweise Autofill
        - id: separate_app_or_extension
          label: Separate Passwortmanager-App oder Browser-Erweiterung
        - id: none
          label: Keine davon
        - id: unsure
          label: Unsicher
        exclusiveOptions:
        - none
        - unsure
      - id: PRE_MFA_USE
        type: singleChoice
        prompt: Bei wie vielen deiner wichtigen Konten nutzt du einen zusätzlichen Anmeldeschritt, zum Beispiel eine App-Bestätigung,
          einen Einmalcode oder einen Sicherheitsschlüssel?
        options:
        - id: none
          label: Bei keinem
        - id: few
          label: Bei wenigen
        - id: about_half
          label: Bei ungefähr der Hälfte
        - id: most_or_all
          label: Bei den meisten oder allen wichtigen Konten
        - id: unsure
          label: Unsicher
      - id: PRE_FAM_PASSWORDS
        type: scale
        scale: familiarity5
        instruction: Wie vertraut bist du derzeit mit den folgenden Themen?
        prompt: Wie vertraut bist du mit starken und unterschiedlichen Passwörtern?
        label: starke und unterschiedliche Passwörter
      - id: PRE_FAM_PM
        type: scale
        scale: familiarity5
        prompt: Wie vertraut bist du mit Passwortmanagern?
        label: Passwortmanager
      - id: PRE_FAM_MFA
        type: scale
        scale: familiarity5
        prompt: Wie vertraut bist du mit MFA/2FA?
        label: MFA/2FA
    - id: self_efficacy
      instruction: Wie sicher bist du dir, dass du die folgenden Aufgaben derzeit bewältigen kannst?
      items:
      - id: SE_PASSWORDS_PRE
        type: scale
        scale: confidence11
        prompt: Starke und unterschiedliche Passwörter für mehrere Konten praktikabel verwalten.
      - id: SE_PM_PRE
        type: scale
        scale: confidence11
        prompt: Einen Passwortmanager so nutzen, dass meine Konten unterschiedliche Passwörter erhalten.
      - id: SE_MFA_PRE
        type: scale
        scale: confidence11
        prompt: MFA/2FA bei einem wichtigen Konto aktivieren.
  post-v1:
    order:
    - ueqs
    - time
    - focus
    - credibility_understanding
    - self_efficacy
    - emotion
    sections:
    - id: ueqs
      source: UEQ-S official German items
      preserveItemOrder: true
      instruction: Bitte bewerte deinen unmittelbaren Gesamteindruck des gerade bearbeiteten Lernangebots. Markiere jeweils
        eine Position zwischen den beiden Begriffen.
      items:
      - id: UEQS_PQ1
        type: semanticDifferential
        scale: ueqSemanticDifferential7
        left: behindernd
        right: unterstützend
        dimension: pragmatic
      - id: UEQS_PQ2
        type: semanticDifferential
        scale: ueqSemanticDifferential7
        left: kompliziert
        right: einfach
        dimension: pragmatic
      - id: UEQS_PQ3
        type: semanticDifferential
        scale: ueqSemanticDifferential7
        left: ineffizient
        right: effizient
        dimension: pragmatic
      - id: UEQS_PQ4
        type: semanticDifferential
        scale: ueqSemanticDifferential7
        left: verwirrend
        right: übersichtlich
        dimension: pragmatic
      - id: UEQS_HQ1
        type: semanticDifferential
        scale: ueqSemanticDifferential7
        left: langweilig
        right: spannend
        dimension: hedonic
      - id: UEQS_HQ2
        type: semanticDifferential
        scale: ueqSemanticDifferential7
        left: uninteressant
        right: interessant
        dimension: hedonic
      - id: UEQS_HQ3
        type: semanticDifferential
        scale: ueqSemanticDifferential7
        left: konventionell
        right: originell
        dimension: hedonic
      - id: UEQS_HQ4
        type: semanticDifferential
        scale: ueqSemanticDifferential7
        left: herkömmlich
        right: neuartig
        dimension: hedonic
    - id: time
      objectiveDurationHiddenUntilSectionCommitted: true
      items:
      - id: TIME_FELT_MINUTES
        type: integer
        min: 1
        max: 90
        prompt: 'Ohne nachzusehen: Wie viele Minuten hat sich das Lernangebot für dich angefühlt?'
        derived: TIME_FELT_MINUTES * 60 - artifactWallClockSeconds
      - id: TIME_FIT
        type: scale
        scale: durationAppropriateness7
        prompt: Die Dauer des Lernangebots war für mich …
      - id: TIME_VALUE
        type: scale
        scale: agreement7
        prompt: Die aufgewendete Zeit stand in einem angemessenen Verhältnis zum Nutzen des Lernangebots.
    - id: focus
      aggregate: false
      instruction: Wie sehr stimmst du den folgenden Aussagen über das Lernangebot zu?
      items:
      - id: USEFULNESS_PRACTICAL
        type: scale
        scale: agreement7
        prompt: Die Inhalte waren für den Schutz von Konten in meinem Alltag praktisch nützlich.
        focus: practical_usefulness
      - id: FOCUS_TF1
        type: scale
        scale: agreement7
        prompt: Die Empfehlungen wurden unterstützend und ohne Vorwürfe vermittelt.
        focus: TF1
      - id: FOCUS_TF2
        type: scale
        scale: agreement7
        prompt: Die Beispiele halfen mir, die Bedeutung für Konten aus meinem Alltag zu erkennen.
        focus: TF2
      - id: FOCUS_TF3
        type: scale
        scale: agreement7
        prompt: Ich habe die Inhalte auf konkrete Kontosituationen angewendet, statt sie nur zu lesen oder anzusehen.
        focus: TF3
      - id: FOCUS_FEEDBACK
        type: scale
        scale: agreement7
        prompt: Die Erklärungen oder Rückmeldungen halfen mir zu verstehen, warum eine Entscheidung sinnvoll oder riskant
          war.
        focus: TF3_TF6
      - id: FOCUS_TF4
        type: scale
        scale: agreement7
        prompt: Die Folgen verschiedener Authentifizierungsentscheidungen wurden für mich anschaulich.
        focus: TF4
      - id: FOCUS_TF5
        type: scale
        scale: agreement7
        prompt: Die Gestaltung hielt mein Interesse am Thema aufrecht.
        focus: TF5
      - id: FOCUS_TF6_MANAGE
        type: scale
        scale: agreement7
        prompt: Die Informationsmenge war für mich gut zu bewältigen.
        focus: TF6
      - id: FOCUS_TF6_ACTION
        type: scale
        scale: agreement7
        prompt: Nach dem Lernangebot wusste ich, welche konkreten nächsten Schritte ich umsetzen könnte.
        focus: TF6
    - id: credibility_understanding
      instruction: Wie sehr stimmst du den folgenden Aussagen zur Glaubwürdigkeit und Verständlichkeit des Lernangebots zu?
      items:
      - id: CRED_TECHNICAL
        type: scale
        scale: agreement7
        prompt: Die Erklärungen wirkten technisch glaubwürdig.
      - id: CRED_BALANCED
        type: scale
        scale: agreement7
        prompt: Die Empfehlungen wirkten ausgewogen und nicht übertrieben.
      - id: UNDERSTANDING_GLOBAL
        type: scale
        scale: agreement7
        prompt: Ich habe die zentralen Zusammenhänge des Lernangebots verstanden.
      - id: UNDERSTANDING_EXPLAIN
        type: scale
        scale: agreement7
        prompt: Ich könnte einer anderen Person erklären, wie die behandelten Schutzmaßnahmen zusammenwirken.
    - id: self_efficacy
      instruction: Wie sicher bist du dir, dass du die folgenden Aufgaben derzeit bewältigen kannst?
      items:
      - id: SE_PASSWORDS_POST
        type: scale
        scale: confidence11
        prompt: Starke und unterschiedliche Passwörter für mehrere Konten praktikabel verwalten.
      - id: SE_PM_POST
        type: scale
        scale: confidence11
        prompt: Einen Passwortmanager so nutzen, dass meine Konten unterschiedliche Passwörter erhalten.
      - id: SE_MFA_POST
        type: scale
        scale: confidence11
        prompt: MFA/2FA bei einem wichtigen Konto aktivieren.
    - id: emotion
      aggregate: false
      instruction: Wie stark hast du dich während des Lernangebots jeweils so gefühlt?
      items:
      - id: EMOTION_CURIOUS
        type: scale
        scale: intensity5
        label: neugierig
      - id: EMOTION_ENCOURAGED
        type: scale
        scale: intensity5
        label: ermutigt
      - id: EMOTION_OVERWHELMED
        type: scale
        scale: intensity5
        label: überfordert
      - id: EMOTION_FRUSTRATED
        type: scale
        scale: intensity5
        label: frustriert
      - id: EMOTION_UNCERTAIN
        type: scale
        scale: intensity5
        label: verunsichert
  guardrail-v2:
    participantTitle: Kurze Abschlussfragen zum Kontoschutz
    purpose: criterion_referenced_immediate_safety_check
    comparisonScope:
    - password_reuse
    - password_manager_for_distinct_passwords
    - mfa_as_additional_barrier
    excludedFromPrimaryComparison:
    - detailed_password_strength
    - passwo_specific_methods
    - product_specific_setup
    - incident_response_beyond_shared_content
    feedbackBeforeComplete: false
    mustNotDuplicateEmbeddedArtifactQuestions: true
    contentAuditRequired: docs/research/GUARDRAIL-CONTENT-AUDIT.md
    scoringShippedToClient: false
    responseFormat:
      type: singleBestAnswer
      substantiveOptionsPerItem: 3
      fixedUnsureOption: true
      multipleResponseUsed: false
    questionOrder:
    - MR_REUSE
    - MR_PASSWORD_MANAGER
    - MR_MFA
    - SCENARIO_LEAK_REUSE_MFA
    - SCENARIO_PM_REDUCE_REUSE
    - SCENARIO_UNIQUE_PLUS_MFA
    optionPresentation:
      strategy: balanced_predefined_forms
      formIds:
      - F1
      - F2
      - F3
      fixedLastOptionId: unsure
      assignedBy: server
      independentOfArtifactCondition: true
      balanceWithinCondition: small_permuted_blocks
      stableAcrossNavigationAndReload: true
      persist:
      - optionOrderFormId
      - displayedOptionIdsByItem
      forms:
        F1:
          MR_REUSE:
          - try_other_service
          - same_username_required
          - risk_stays_at_breached_service
          - unsure
          MR_PASSWORD_MANAGER:
          - one_strong_reused
          - distinct_per_account
          - store_similar_unchanged
          - unsure
          MR_MFA:
          - reuse_becomes_safe
          - prevents_password_exposure
          - additional_barrier
          - unsure
          SCENARIO_LEAK_REUSE_MFA:
          - replace_both_distinct_keep_mfa
          - change_shop_keep_email_due_mfa
          - same_core_different_endings
          - unsure
          SCENARIO_PM_REDUCE_REUSE:
          - store_shared_password
          - replace_gradually_with_pm
          - unique_only_for_important
          - unsure
          SCENARIO_UNIQUE_PLUS_MFA:
          - reuse_long_and_mfa
          - new_unique_without_mfa
          - new_unique_and_mfa
          - unsure
        F2:
          MR_REUSE:
          - same_username_required
          - risk_stays_at_breached_service
          - try_other_service
          - unsure
          MR_PASSWORD_MANAGER:
          - distinct_per_account
          - store_similar_unchanged
          - one_strong_reused
          - unsure
          MR_MFA:
          - prevents_password_exposure
          - additional_barrier
          - reuse_becomes_safe
          - unsure
          SCENARIO_LEAK_REUSE_MFA:
          - change_shop_keep_email_due_mfa
          - same_core_different_endings
          - replace_both_distinct_keep_mfa
          - unsure
          SCENARIO_PM_REDUCE_REUSE:

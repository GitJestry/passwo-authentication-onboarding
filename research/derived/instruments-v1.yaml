    nativeArtifactCheckPolicy:
      retainNativeChecksInPrimaryPath: true
      nativeScoresAreStudyOutcomes: false
      externalItemsMustBeNovelAndTransferOriented: true
      doNotMixSecAwareQuizAndSkipPaths: true
    blocks:
    - id: recognition
      submitLocksBlock: true
      items:
      - id: MR_REUSE
        prompt: Ein Passwort wird bei zwei voneinander unabhängigen Diensten verwendet. Bei einem Dienst wird es bekannt.
          Welche Folge ist dadurch zusätzlich möglich?
        options:
        - id: try_other_service
          label: Das bekannte Passwort kann auch beim anderen Dienst ausprobiert werden.
          classification: correct
        - id: same_username_required
          label: Ein Versuch beim anderen Dienst ist nur sinnvoll, wenn auch der Benutzername identisch ist.
          classification: unsafe
        - id: risk_stays_at_breached_service
          label: Das zusätzliche Risiko bleibt auf den Dienst begrenzt, bei dem das Passwort bekannt wurde.
          classification: unsafe
        - id: unsure
          label: Weiß ich nicht.
          classification: unsure
      - id: MR_PASSWORD_MANAGER
        prompt: Welche Nutzung eines Passwortmanagers adressiert Passwortwiederverwendung am direktesten?
        options:
        - id: distinct_per_account
          label: Für verschiedene Konten unterschiedliche Passwörter erzeugen oder speichern und passend ausfüllen lassen.
          classification: correct
        - id: one_strong_reused
          label: Ein besonders starkes Passwort speichern und bei möglichst vielen Konten verwenden.
          classification: unsafe
        - id: store_similar_unchanged
          label: Bereits ähnliche Passwörter speichern, ohne sie voneinander zu trennen.
          classification: incomplete
        - id: unsure
          label: Weiß ich nicht.
          classification: unsure
      - id: MR_MFA
        prompt: Welche Aussage beschreibt die Rolle von MFA/2FA am treffendsten?
        options:
        - id: additional_barrier
          label: MFA kann eine zusätzliche Anmeldebarriere bilden, wenn das Passwort bekannt ist.
          classification: correct
        - id: reuse_becomes_safe
          label: Mit MFA kann dasselbe Passwort bei mehreren Konten ohne zusätzliches Risiko verwendet werden.
          classification: unsafe
        - id: prevents_password_exposure
          label: MFA verhindert, dass ein Passwort durch ein Datenleck oder andere Wege bekannt wird.
          classification: incorrect
        - id: unsure
          label: Weiß ich nicht.
          classification: unsure
    - id: scenarios
      submitLocksBlock: true
      items:
      - id: SCENARIO_LEAK_REUSE_MFA
        prompt: Bei einem Online-Shop wird dein dort verwendetes Passwort als kompromittiert gemeldet. Dasselbe Passwort nutzt
          du auch für dein E-Mail-Konto; dort ist MFA aktiviert. Welche Reaktion adressiert das beschriebene Risiko am vollständigsten?
        options:
        - id: replace_both_distinct_keep_mfa
          label: Für beide Konten neue, voneinander verschiedene Passwörter setzen und MFA beim E-Mail-Konto beibehalten.
          classification: appropriate
        - id: change_shop_keep_email_due_mfa
          label: Nur beim Online-Shop das Passwort ändern und das E-Mail-Passwort wegen MFA beibehalten.
          classification: unsafe
        - id: same_core_different_endings
          label: Bei beiden Konten denselben Passwortkern behalten, aber unterschiedliche Endungen ergänzen.
          classification: unsafe
        - id: unsure
          label: Weiß ich nicht.
          classification: unsure
      - id: SCENARIO_PM_REDUCE_REUSE
        prompt: Du bemerkst, dass mehrere Konten dasselbe oder ein sehr ähnliches Passwort verwenden. Du möchtest das schrittweise
          ändern, ohne alle neuen Passwörter auswendig zu lernen. Welche Vorgehensweise passt am besten?
        options:
        - id: replace_gradually_with_pm
          label: Mit einem Passwortmanager nach und nach eigene Passwörter für diese Konten erzeugen oder speichern und die
            alten ersetzen.
          classification: appropriate
        - id: store_shared_password
          label: Das gemeinsame Passwort in einem Passwortmanager speichern und unverändert weiterverwenden.
          classification: unsafe
        - id: unique_only_for_important
          label: Nur bei den wichtigsten Konten unterschiedliche Passwörter verwenden und das gemeinsame Passwort bei den
            übrigen behalten.
          classification: incomplete
        - id: unsure
          label: Weiß ich nicht.
          classification: unsure
      - id: SCENARIO_UNIQUE_PLUS_MFA
        prompt: Du richtest ein wichtiges Konto ein. Ein langes Passwort, das du bereits bei einem anderen Konto verwendest,
          wäre leicht verfügbar; der Dienst bietet MFA/2FA an. Was ist die sinnvollste Einrichtung?
        options:
        - id: new_unique_and_mfa
          label: Für dieses Konto ein neues, eigenes Passwort verwenden und MFA/2FA aktivieren.
          classification: appropriate
        - id: reuse_long_and_mfa
          label: Das bereits verwendete lange Passwort übernehmen und zusätzlich MFA/2FA aktivieren.
          classification: unsafe
        - id: new_unique_without_mfa
          label: Ein neues, eigenes Passwort verwenden und auf MFA/2FA verzichten, weil das Passwort einzigartig ist.
          classification: incomplete
        - id: unsure
          label: Weiß ich nicht.
          classification: unsure
        provisionalUntilContentAudit: true

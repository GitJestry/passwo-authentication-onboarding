schemaVersion: 3
instrumentVersion: 2.1.0
questionnaireVersion: questionnaire-v3
guardrailVersion: guardrail-v4
consentVersion: consent-v7-draft
followUpVersion: follow-up-v5
runtimeManifestVersion: instrument-runtime-v2.1
language: de-DE
participantTerm: Lernangebot
scales:
  agreement7:
    type: integer
    min: 1
    max: 7
    anchors:
      '1': stimme überhaupt nicht zu
      '2': stimme nicht zu
      '3': stimme eher nicht zu
      '4': weder noch
      '5': stimme eher zu
      '6': stimme zu
      '7': stimme vollständig zu
  confidence11:
    type: integer
    min: 0
    max: 10
    anchors:
      '0': überhaupt nicht zuversichtlich
      '5': mäßig zuversichtlich
      '10': völlig zuversichtlich
  durationAppropriateness7:
    type: integer
    min: 1
    max: 7
    anchors:
      '1': deutlich zu kurz
      '2': zu kurz
      '3': eher zu kurz
      '4': genau richtig
      '5': eher zu lang
      '6': zu lang
      '7': deutlich zu lang
  perceivedDuration7:
    type: integer
    min: 1
    max: 7
    anchors:
      '1': sehr kurz
      '2': kurz
      '3': eher kurz
      '4': weder kurz noch lang
      '5': eher lang
      '6': lang
      '7': sehr lang
  ueqSemanticDifferential7:
    type: integer
    min: 1
    max: 7
    derivedTransform: value - 4
  riskPresentation7:
    type: integer
    min: 1
    max: 7
    anchors:
      '1': deutlich verharmlost
      '2': verharmlost
      '3': eher verharmlost
      '4': angemessen
      '5': eher übertrieben
      '6': übertrieben
      '7': deutlich übertrieben
analysis:
  selfEfficacy:
    aggregateScore: false
    scale: confidence11
    topics:
      distinctAccess:
        preItemId: SE_DISTINCT_ACCESS_PRE
        postItemId: SE_DISTINCT_ACCESS_POST
      passwordManagerNewAccount:
        preItemId: SE_PM_NEW_ACCOUNT_PRE
        postItemId: SE_PM_NEW_ACCOUNT_POST
      passwordManagerLogin:
        preItemId: SE_PM_LOGIN_PRE
        postItemId: SE_PM_LOGIN_POST
      mfaActivation:
        preItemId: SE_MFA_ENABLE_PRE
        postItemId: SE_MFA_ENABLE_POST
  guardrail:
    aggregateScore: false
    passFailThreshold: null
    unsafeMisconceptionSum: false
    primaryBlocks:
    - scenarios
    secondaryBlocks:
    - recognition
  followUpSource: research/derived/follow-up-v5.yaml
procedures:
  eligibility:
    persisted: false
    items:
    - id: ELIG_AGE
      prompt: Ich bin mindestens 18 Jahre alt.
      requiredValue: true
    - id: ELIG_UNIVERSITY
      prompt: Ich bin derzeit Mitglied einer Hochschule.
      requiredValue: true
    - id: ELIG_GERMAN
      prompt: Ich kann deutschsprachige Lernmaterialien und Fragebogenfragen sicher verstehen.
      requiredValue: true
  participantInformation:
    source: docs/research/PARTICIPANT-INFORMATION.md
    eyebrow: Studie zu Passwörtern und dem Schutz von Online-Konten
    welcomeHeading: Willkommen
    welcomeParagraphs:
    - Vielen Dank, dass du dir Zeit für diese Studie nimmst. Im ersten Studienteil bearbeitest du ein digitales Lernangebot
      zu Passwörtern und zum Schutz von Online-Konten. Vor und nach dem Lernangebot beantwortest du einige Fragen.
    readMoreLabel: Ausführliche Teilnahmeinformationen
    informationHeading: Informationen zu deiner Teilnahme
    sections:
    - id: purpose
      heading: Worum geht es?
      paragraphs:
      - Wir untersuchen, wie ein digitales Lernangebot zu Passwörtern und Kontoschutz genutzt, wahrgenommen und verstanden
        wird.
      - Einige Details zur genauen Forschungsfrage erläutern wir dir erst nach Abschluss aller Studienteile. Dadurch soll
        vermieden werden, dass diese Informationen deine Bearbeitung oder deine Antworten vorab beeinflussen.
    - id: procedure
      heading: Was erwartet dich?
      paragraphs:
      - Zunächst beantwortest du kurze Fragen zu deiner Person und zu bisherigen Erfahrungen mit den behandelten Themen. Danach
        bearbeitest du ein digitales Lernangebot. Abschließend folgen Fragen zu deiner Wahrnehmung des Angebots und zu den
        vermittelten Inhalten. Die heutige Sitzung dauert voraussichtlich 20 bis 30 Minuten.
      - Die Studie umfasst die heutige Sitzung von etwa 20 bis 30 Minuten und einen kurzen zweiten Teil etwa zehn Tage später.
        Der zweite Teil dauert ungefähr ein bis zwei Minuten und wird per E-Mail bereitgestellt.
      - Das Zeitfenster für die dort erfragten Angaben endet 240 Stunden nach Abschluss der heutigen Sitzung. Der Link bleibt
        anschließend für die Abgabe bis zum angegebenen Schließungszeitpunkt verfügbar.
    - id: data
      heading: Welche Daten werden verarbeitet?
      paragraphs:
      - Gespeichert werden deine Fragebogenantworten, Bearbeitungs- und Abschnittszeiten, der technische Abschlussstatus sowie
        die für die Auswertung erforderlichen Angaben zum bearbeiteten Lernangebot, zu Versionen und Darstellungsreihenfolgen.
        Die Forschungsdaten werden unter einer zufällig erzeugten, nicht angezeigten Forschungs-ID pseudonymisiert gespeichert
        und ausgewertet. Sie enthalten weder deinen Namen noch deine E-Mail-Adresse.
      - Deine E-Mail-Adresse wird getrennt von den Forschungsdaten gespeichert und ausschließlich für den zweiten Studienteil,
        höchstens eine Erinnerung und die abschließende Aufklärung verwendet.
    - id: voluntariness
      heading: Freiwilligkeit und Abbruch
      paragraphs:
      - Die Teilnahme ist freiwillig. Du kannst sie jederzeit ohne Begründung und ohne Nachteile beenden. Innerhalb der vor
        dem Study Freeze festgelegten Aufbewahrungs- und Löschfrist kannst du unter Angabe deines Löschcodes die Löschung
        deiner Forschungsdaten verlangen.
    - id: burden
      heading: Mögliche Belastungen und Nutzen
      paragraphs:
      - Es sind keine besonderen Risiken zu erwarten, die über alltägliche Belastungen bei der Nutzung digitaler Lernangebote
        und Fragebögen hinausgehen. Ein unmittelbarer persönlicher Nutzen kann nicht zugesichert werden.
    - id: contact
      heading: Fragen und Kontakt
      paragraphs:
      - 'Bei Fragen zur Studie, zur Teilnahme oder zur Verarbeitung deiner Daten kannst du dich an folgende Stelle wenden:'
      - 'Studienleitung: Julian Meyer, s27jmeye@uni-bonn.de'
      - 'Betreuung: Dr. Christian Tiefenau, tiefenau@cs.uni-bonn.de'
      - 'Verantwortliche Stelle: Rheinische Friedrich-Wilhelms-Universität Bonn, Regina-Pacis-Weg 3, 53113 Bonn, kommunikation@uni-bonn.de,
        +49 228 73-0'
      - 'Datenschutzbeauftragte: Derya Kartal, Rheinische Friedrich-Wilhelms-Universität Bonn, Adenauerallee 72–74, 53115
        Bonn, datenschutz@uni-bonn.de, +49 228 73-4096'
    - id: rights
      heading: Rechtsgrundlage und deine Rechte
      paragraphs:
      - Die Verarbeitung deiner Forschungsdaten und deiner getrennt gespeicherten E-Mail-Adresse beruht auf deiner Einwilligung
        gemäß Art. 6 Abs. 1 lit. a DSGVO. Du kannst deine Einwilligung jederzeit mit Wirkung für die Zukunft
        widerrufen. Die Rechtmäßigkeit der bis zum Widerruf erfolgten Verarbeitung bleibt davon unberührt.
      - Du hast im Rahmen der gesetzlichen Voraussetzungen insbesondere das Recht auf Auskunft, Berichtigung, Löschung, Einschränkung
        der Verarbeitung und Datenübertragbarkeit. Außerdem kannst du dich bei der Landesbeauftragten für Datenschutz und
        Informationsfreiheit Nordrhein-Westfalen beschweren. Für die Zuordnung einer Löschanfrage zu deinen Forschungsdaten
        verwendest du deinen Löschcode.
    requiredConsent:
      legend: Einwilligung
      statement: Ich habe die Teilnahmeinformationen gelesen und verstanden. Ich weiß, dass die Studie aus der heutigen Sitzung
        und einem kurzen zweiten Teil etwa zehn Tage später besteht und einige Einzelheiten zur genauen Fragestellung erst
        danach erläutert werden. Ich willige freiwillig in beide Studienteile und in die beschriebene pseudonymisierte Verarbeitung
        meiner Forschungsdaten ein.
    actions:
      acceptLabel: Teilnahme beginnen
      declineLabel: Nicht teilnehmen
      declineHeading: Danke für deine Rückmeldung
      declineBody: Du nimmst nicht an der Studie teil. Es wurde keine Sitzung angelegt.
    essentialSummaryHeading: Das Wichtigste zur Teilnahme
    essentialSummaryParagraphs:
    - Die heutige Sitzung dauert voraussichtlich 20 bis 30 Minuten. Die Teilnahme ist freiwillig und kann jederzeit ohne Begründung
      und ohne Nachteile beendet werden.
    - Gespeichert werden Fragebogenantworten, Bearbeitungs- und Abschnittszeiten, der technische Abschlussstatus sowie erforderliche
      Angaben zum bearbeiteten Lernangebot, zu Versionen und Darstellungsreihenfolgen. Es werden keine realen Passwörter oder
      Kontozugangsdaten verlangt.
    - Die Studie umfasst die heutige Sitzung von etwa 20 bis 30 Minuten und einen kurzen zweiten Teil nach etwa zehn Tagen.
      Für den zweiten Teil wird eine E-Mail-Adresse mit gesonderter Einwilligung und getrennt von den Forschungsdaten gespeichert.
      Ein unmittelbarer persönlicher Nutzen kann nicht zugesichert werden.
    - Fragen zur Studie oder Datenverarbeitung können an die in den ausführlichen Teilnahmeinformationen genannten Kontakte
      gerichtet werden.
  followUpRecontact:
    optional: false
    consentLegend: Kontakt für den zweiten Studienteil
    consentStatement: Ich willige ein, dass meine E-Mail-Adresse getrennt von den Forschungsdaten gespeichert und ausschließlich
      für den zweiten Studienteil, höchstens eine Erinnerung und die abschließende Aufklärung verwendet wird.
    emailLabel: E-Mail-Adresse für den zweiten Studienteil
    emailRequired: true
    emailNeverStoredInResearchDatabase: true
    firstInvitationDelayHours: 240
    reminderDelayAfterFirstInvitationHours: 48
    closeAfterSessionHours: 336
    emailSubject: Zweiter Studienteil ist jetzt verfügbar
    emailContainsTrainingAdvice: false
  sessionClosure:
    afterFirstStudyPart:
      heading: Vielen Dank für deine Teilnahme
      paragraphs:
      - Der erste Studienteil ist abgeschlossen. Etwa zehn Tage nach deiner heutigen Teilnahme erhältst du per E-Mail den
        kurzen zweiten und letzten Studienteil.
      - Die vollständige Aufklärung erhältst du nach dessen Abgabe oder spätestens nach Schließung des Antwortfensters. Du
        kannst dieses Fenster jetzt schließen.
      actionLabel: Sitzung abschließen
instruments:
  pre-v1:
    sections:
    - id: sample
      items:
      - id: PRE_ROLE
        type: singleChoice
        prompt: Welche Rolle beschreibt deine überwiegende Tätigkeit an der Hochschule am besten?
        options:
        - id: undergraduate
          label: Bachelor, Staatsexamen oder anderes grundständiges Studium
        - id: graduate
          label: Master oder anderes weiterführendes Studium
        - id: doctoral
          label: Promotion, auch bei gleichzeitiger Beschäftigung
        - id: academic_teaching
          label: Wissenschaft oder Lehre ohne Promotion
        - id: technical_admin_service
          label: Technik, Verwaltung oder Service
        - id: other_university
          label: Anderer Hochschulbereich
        - id: no_answer
          label: Keine Angabe
      - id: PRE_FIELD
        type: singleChoice
        prompt: Welchem Bereich bist du überwiegend zugeordnet?
        options:
        - id: stem
          label: Mathematik, Informatik, Naturwissenschaften oder Technik
        - id: medicine_life_sciences
          label: Medizin, Gesundheit oder Lebenswissenschaften
        - id: law_economics
          label: Rechts- oder Wirtschaftswissenschaften
        - id: social_behavioral
          label: Sozial- oder Verhaltenswissenschaften
        - id: humanities_culture_languages
          label: Geistes-, Kultur- oder Sprachwissenschaften
        - id: administration_service_no_field
          label: Zentrale Einrichtung, Verwaltung oder keinem Fachbereich zugeordnet
        - id: other
          label: Anderer Bereich
        - id: no_answer
          label: Keine Angabe
      - id: PRE_AGE
        type: singleChoice
        prompt: Zu welcher Altersgruppe gehörst du?
        options:
        - id: age_18_25
          label: 18–25 Jahre
        - id: age_26_35
          label: 26–35 Jahre
        - id: age_36_45
          label: 36–45 Jahre
        - id: age_46_55
          label: 46–55 Jahre
        - id: age_56_65
          label: 56–65 Jahre
        - id: age_66_plus
          label: 66 Jahre oder älter
        - id: no_answer
          label: Keine Angabe
    - id: experience
      items:
      - id: PRE_TRAINING
        type: singleChoice
        prompt: Wie oft hast du bereits ein Training oder Lernmodul zu Passwörtern, Passwortmanagern oder MFA/2FA bearbeitet?
        options:
        - id: never
          label: Nie
        - id: once
          label: Einmal
        - id: multiple
          label: Mehrmals
        - id: unsure
          label: Unsicher
      - id: PRE_PM_USE
        type: multiChoice
        prompt: Welche Möglichkeiten nutzt du aktuell, um Passwörter zu speichern oder beim Anmelden einzusetzen?
        instruction: Mehrfachauswahl ist möglich.
        options:
        - id: browser_or_device_integrated
          label: Die im Browser, Betriebssystem oder Gerät integrierte Funktion verwenden, um Passwörter zu speichern oder
            automatisch ausfüllen zu lassen.
        - id: separate_app_or_extension
          label: Eine separate Passwortmanager-App oder deren Browser-Erweiterung verwenden.
        - id: none
          label: Keine dieser Möglichkeiten.
        - id: unsure
          label: Unsicher.
        exclusiveOptions:
        - none
        - unsure
      - id: PRE_MFA_USE
        type: singleChoice
        prompt: Bei wie vielen Konten, die dir persönlich wichtig sind, ist nach deinem Wissen eine Mehrfaktor- oder Zwei-Faktor-Authentifizierung
          (MFA/2FA) aktiviert?
        options:
        - id: none
          label: Bei keinem.
        - id: few
          label: Bei wenigen.
        - id: about_half
          label: Bei etwa der Hälfte.
        - id: most
          label: Bei den meisten.
        - id: all
          label: Bei allen.
        - id: unsure
          label: Unsicher.
    - id: self_efficacy
      instruction: Wie zuversichtlich bist du derzeit, die folgenden Aufgaben selbstständig durchführen zu können?
      items:
      - id: SE_DISTINCT_ACCESS_PRE
        type: scale
        scale: confidence11
        prompt: Für mehrere Konten unterschiedliche Passwörter so verwalten, dass ich mich später bei jedem Konto wieder anmelden
          kann.
      - id: SE_PM_NEW_ACCOUNT_PRE
        type: scale
        scale: confidence11
        prompt: Mit einem Passwortmanager für ein neues Konto ein nur dort verwendetes Passwort erzeugen und speichern.
      - id: SE_PM_LOGIN_PRE
        type: scale
        scale: confidence11
        prompt: Ein im Passwortmanager gespeichertes Passwort bei einer späteren Anmeldung abrufen oder automatisch ausfüllen
          lassen.
      - id: SE_MFA_ENABLE_PRE
        type: scale
        scale: confidence11
        prompt: MFA/2FA in den Einstellungen eines wichtigen Kontos aktivieren.
  post-v1:
    order:
    - ueqs
    - content_trustworthiness
    - duration
    - design_diagnostics
    - risk_understanding
    - self_efficacy
    - secaware_prior_exposure
    sections:
    - id: ueqs
      source: UEQ-S official German items
      preserveItemOrder: true
      instruction: Bitte bewerte deinen unmittelbaren Gesamteindruck des gerade bearbeiteten Lernangebots. Markiere jeweils
        eine Position zwischen den beiden Begriffen.
      items:
      - id: UEQS_PQ1
        type: semanticDifferential
        scale: ueqSemanticDifferential7
        left: behindernd
        right: unterstützend
      - id: UEQS_PQ2
        type: semanticDifferential
        scale: ueqSemanticDifferential7
        left: kompliziert
        right: einfach
      - id: UEQS_PQ3
        type: semanticDifferential
        scale: ueqSemanticDifferential7
        left: ineffizient
        right: effizient
      - id: UEQS_PQ4
        type: semanticDifferential
        scale: ueqSemanticDifferential7
        left: verwirrend
        right: übersichtlich
      - id: UEQS_HQ1
        type: semanticDifferential
        scale: ueqSemanticDifferential7
        left: langweilig
        right: spannend
      - id: UEQS_HQ2
        type: semanticDifferential
        scale: ueqSemanticDifferential7
        left: uninteressant
        right: interessant
      - id: UEQS_HQ3
        type: semanticDifferential
        scale: ueqSemanticDifferential7
        left: konventionell
        right: originell
      - id: UEQS_HQ4
        type: semanticDifferential
        scale: ueqSemanticDifferential7
        left: herkömmlich
        right: neuartig
    - id: content_trustworthiness
      source: UEQ+ Trustworthiness of Content, official German items
      preserveItemOrder: true
      instruction: 'Die Informationen und Daten, die mir das Lernangebot bereitstellt, sind:'
      items:
      - id: UEQP_TOC1
        type: semanticDifferential
        scale: ueqSemanticDifferential7
        left: nutzlos
        right: nützlich
      - id: UEQP_TOC2
        type: semanticDifferential
        scale: ueqSemanticDifferential7
        left: unglaubwürdig
        right: glaubwürdig
      - id: UEQP_TOC3
        type: semanticDifferential
        scale: ueqSemanticDifferential7
        left: unseriös
        right: seriös
      - id: UEQP_TOC4
        type: semanticDifferential
        scale: ueqSemanticDifferential7
        left: ungenau
        right: genau
    - id: duration
      objectiveDurationHiddenUntilSectionCommitted: true
      items:
      - id: PERCEIVED_DURATION
        type: scale
        scale: perceivedDuration7
        prompt: Wie lang hat sich die Bearbeitung des Lernangebots für dich angefühlt?
      - id: TIME_FIT
        type: scale
        scale: durationAppropriateness7
        prompt: Wie passend war die Dauer des Lernangebots für dich?
    - id: design_diagnostics
      items:
      - id: USEFULNESS_PRACTICAL
        type: scale
        scale: agreement7
        prompt: Die Inhalte waren nützlich, um Entscheidungen zum Schutz meiner Konten zu treffen.
      - id: NONBLAMING_COMMUNICATION
        type: scale
        scale: agreement7
        prompt: Die Sicherheitsempfehlungen wurden ohne persönliche Vorwürfe vermittelt.
      - id: PERSONAL_RELEVANCE
        type: scale
        scale: agreement7
        prompt: Die Beispiele machten deutlich, warum die Inhalte für Konten relevant sind, die ich im Alltag nutze.
      - id: APPLICATION_OPPORTUNITY
        type: scale
        scale: agreement7
        prompt: Das Lernangebot gab mir Gelegenheit, die Inhalte auf konkrete Kontosituationen anzuwenden.
      - id: MECHANISM_EXPLANATION
        type: scale
        scale: agreement7
        prompt: Das Lernangebot erklärte nachvollziehbar, warum die empfohlenen Maßnahmen Konten besser schützen.
      - id: CONSEQUENCE_TANGIBILITY
        type: scale
        scale: agreement7
        prompt: Durch das Lernangebot konnte ich mir konkret vorstellen, wie sich unterschiedliche Entscheidungen auf den
          Schutz von Konten auswirken können.
      - id: INFORMATION_MANAGEABILITY
        type: scale
        scale: agreement7
        prompt: Die Informationsmenge war für mich gut zu bewältigen.
      - id: ACTION_CLARITY
        type: scale
        scale: agreement7
        prompt: Nach dem Lernangebot war mir klar, welche konkreten Schritte ich als Nächstes zum Schutz eigener Konten unternehmen
          könnte.
    - id: risk_understanding
      items:
      - id: RISK_PRESENTATION
        type: scale
        scale: riskPresentation7
        prompt: Wie wirkte die Darstellung der Sicherheitsrisiken auf dich?
      - id: UNDERSTANDING_GLOBAL
        type: scale
        scale: agreement7
        prompt: Ich habe die zentralen Zusammenhänge des Lernangebots verstanden.
    - id: self_efficacy
      instruction: Wie zuversichtlich bist du derzeit, die folgenden Aufgaben selbstständig durchführen zu können?
      items:
      - id: SE_DISTINCT_ACCESS_POST
        type: scale
        scale: confidence11
        prompt: Für mehrere Konten unterschiedliche Passwörter so verwalten, dass ich mich später bei jedem Konto wieder anmelden
          kann.
      - id: SE_PM_NEW_ACCOUNT_POST
        type: scale
        scale: confidence11
        prompt: Mit einem Passwortmanager für ein neues Konto ein nur dort verwendetes Passwort erzeugen und speichern.
      - id: SE_PM_LOGIN_POST
        type: scale
        scale: confidence11
        prompt: Ein im Passwortmanager gespeichertes Passwort bei einer späteren Anmeldung abrufen oder automatisch ausfüllen
          lassen.
      - id: SE_MFA_ENABLE_POST
        type: scale
        scale: confidence11
        prompt: MFA/2FA in den Einstellungen eines wichtigen Kontos aktivieren.
    - id: secaware_prior_exposure
      items:
      - id: PRE_SECAWARE_RETROSPECTIVE
        type: singleChoice
        prompt: Welche Aussage traf bereits vor deiner heutigen Studienteilnahme auf dich zu?
        options:
        - id: unknown
          label: Ich kannte SecAware.NRW nicht.
        - id: known_not_completed
          label: Ich kannte SecAware.NRW, hatte das Modul „Passwörter & Authentifizierung“ aber noch nicht bearbeitet.
        - id: partially_completed
          label: Ich hatte das Modul bereits teilweise bearbeitet.
        - id: fully_completed
          label: Ich hatte das Modul bereits vollständig bearbeitet.
        - id: unsure
          label: Unsicher.
  guardrail-v2:
    participantTitle: Fragen zu den Inhalten
    purpose: immediate_understanding_guardrail
    comparisonScope:
    - password_reuse
    - password_manager
    - mfa
    excludedFromPrimaryComparison:
    - prototype_specific_password_thresholds
    - six_word_method
    - visualization_categories
    feedbackBeforeComplete: false
    mustNotDuplicateEmbeddedArtifactQuestions: true
    contentAuditRequired: docs/research/GUARDRAIL-CONTENT-AUDIT.md
    responseFormat:
      type: singleBestAnswer
      substantiveOptionsPerItem: 3
      fixedUnsureOption: true
      multipleResponseUsed: false
    questionOrder:
    - SC_BREACH_REUSE
    - SC_PM_MANY_ACCOUNTS
    - SC_LAYERED_PROTECTION
    - MR_REUSE
    - MR_PASSWORD_MANAGER
    - MR_MFA
    questionPresentation:
      fixedRecognitionOrder:
      - MR_REUSE
      - MR_PASSWORD_MANAGER
      - MR_MFA
      scenarioOrderByForm:
        F1:
        - SC_BREACH_REUSE
        - SC_PM_MANY_ACCOUNTS
        - SC_LAYERED_PROTECTION
        F2:
        - SC_BREACH_REUSE
        - SC_LAYERED_PROTECTION
        - SC_PM_MANY_ACCOUNTS
        F3:
        - SC_PM_MANY_ACCOUNTS
        - SC_BREACH_REUSE
        - SC_LAYERED_PROTECTION
        F4:
        - SC_PM_MANY_ACCOUNTS
        - SC_LAYERED_PROTECTION
        - SC_BREACH_REUSE
        F5:
        - SC_LAYERED_PROTECTION
        - SC_BREACH_REUSE
        - SC_PM_MANY_ACCOUNTS
        F6:
        - SC_LAYERED_PROTECTION
        - SC_PM_MANY_ACCOUNTS
        - SC_BREACH_REUSE
    optionPresentation:
      strategy: balanced_predefined_forms
      formIds:
      - F1
      - F2
      - F3
      - F4
      - F5
      - F6
      fixedLastOptionId: unsure
      assignedBy: server
      independentOfArtifactCondition: true
      balanceWithinCondition: small_permuted_blocks
      stableAcrossNavigationAndReload: true
      persist:
      - optionOrderFormId
      - displayedOptionIdsByItem
      forms:
        F1:
          SC_BREACH_REUSE:
          - new_distinct_both
          - change_shop_only
          - mfa_email_keep_shared
          - unsure
          SC_PM_MANY_ACCOUNTS:

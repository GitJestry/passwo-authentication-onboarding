version: follow-up-v6-pilot
language: de-DE
status: pre-pilot-candidate
runtimeBoundary:
  bundledWithMainStudyClient: false
  hostedByStudyWebDeployment: true
  responseHandledByStudyApi: true
  manualResponseImport: false
  delivery: separate tokenized route in the same study web deployment
schedule:
  firstInvitationDelayHours: 240
  reminderDelayAfterFirstInvitationHours: 48
  closeAfterSessionHours: 336
  estimatedMinutes: 2
email:
  subject: Freiwillige Nachbefragung zur Studie
  containsAuthenticationAdvice: false
  body: |-
    Hallo,

    vor ungefähr zehn Tagen hast du an unserer Studie zu einem digitalen Lernangebot über Passwörter und den Schutz von Online-Konten teilgenommen. Die freiwillige kurze Nachbefragung ist jetzt verfügbar und dauert etwa zwei Minuten.

    Zur Nachbefragung: [TOKEN_LINK]

    Dieser freiwillige Folgefragebogen untersucht, ob du seit deiner Teilnahme konkrete Schritte zum Schutz deiner Online-Konten unternommen hast und welche Gründe eine Umsetzung erleichtert oder verhindert haben. Deine Teilnahme ist freiwillig. Wenn du nicht teilnimmst, entstehen dir keine Nachteile.

    Bitte beziehe deine Angaben ausschließlich auf Handlungen, die du nach der Studie und bereits vor [STICHTAG] durchgeführt hattest. Der Link ist bis [CLOSES_AT] gültig und darf nicht weitergegeben werden.

    Vielen Dank für deine Unterstützung.
reminderEmail:
  subject: Erinnerung an die freiwillige Nachbefragung
  containsAuthenticationAdvice: false
  body: |-
    Hallo,

    dies ist die einmalige Erinnerung an die freiwillige Nachbefragung zu deiner Studienteilnahme. Falls du bereits teilgenommen hast, kannst du diese Nachricht ignorieren.

    Zur Nachbefragung: [TOKEN_LINK]

    Die Bearbeitung dauert etwa zwei Minuten. Deine Teilnahme ist freiwillig. Wenn du nicht teilnimmst, entstehen dir keine Nachteile. Bitte beziehe deine Angaben ausschließlich auf Handlungen, die du nach der Studie und bereits vor [STICHTAG] durchgeführt hattest. Der Link ist bis [CLOSES_AT] gültig und darf nicht weitergegeben werden.
landingPage:
  title: Freiwillige Nachbefragung
  disclosure: |-
    Dieser freiwillige Folgefragebogen untersucht, ob du seit deiner Teilnahme konkrete Schritte zum Schutz deiner Online-Konten unternommen hast und welche Gründe eine Umsetzung erleichtert oder verhindert haben. Die Bearbeitung dauert etwa zwei Minuten. Deine Teilnahme ist freiwillig. Wenn du nicht teilnimmst, entstehen dir keine Nachteile.
  voluntaryConfirmation: Ich habe die Informationen gelesen und möchte freiwillig an der Nachbefragung teilnehmen.
questionnaire:
  title: Freiwillige Nachbefragung
  reportingInstruction: Bitte beziehe dich ausschließlich auf Handlungen, die du nach deiner Studienteilnahme und bereits vor [STICHTAG] durchgeführt hattest.
  safetyNote: Öffne oder ändere für diese Befragung keine Kontoeinstellungen. Bitte nenne keine Konten, Dienste, Passwörter, Anmeldecodes oder Wiederherstellungsdaten.
  items:
    - id: FU_PASSWORD_PM_ACTIONS
      type: multiChoice
      prompt: Welche der folgenden Handlungen hast du nach der Studie und vor dem oben genannten Zeitpunkt durchgeführt?
      instruction: Mehrfachauswahl ist möglich. Integrierte und separat installierte Passwortmanager zählen gleichermaßen.
      options:
        - id: replaced_reused_or_varied_password
          label: Ich habe bei mindestens einem bestehenden Konto ein Passwort ersetzt, das ich auch bei einem anderen Konto verwendet oder nur leicht verändert hatte.
        - id: inspected_available_manager
          label: Ich habe geprüft, welcher Passwortmanager auf meinem Gerät oder in meinem Browser verfügbar ist.
        - id: generated_stored_account_specific
          label: Ich habe mit einem Passwortmanager für mindestens eines meiner Konten ein eigenes Passwort erzeugt und gespeichert.
        - id: used_retrieval_or_autofill
          label: Ich habe ein gespeichertes Passwort bewusst über Autofill oder durch Abruf aus dem Passwortmanager verwendet.
        - id: checked_manager_access_or_recovery
          label: Ich habe geprüft, wie ich auf einem neuen Gerät oder nach einem Geräteverlust wieder auf meinen Passwortmanager zugreifen könnte.
        - id: none
          label: Keine dieser Handlungen.
      exclusiveOptions: [none]
    - id: FU_MFA_ACTIONS
      type: multiChoice
      prompt: Welche der folgenden Handlungen hast du nach der Studie und vor dem oben genannten Zeitpunkt durchgeführt?
      instruction: Mehrfachauswahl ist möglich.
      options:
        - id: checked_availability_or_status
          label: Ich habe bei mindestens einem Konto geprüft, ob MFA/2FA verfügbar oder bereits aktiviert ist.
        - id: enabled_mfa
          label: Ich habe MFA/2FA bei mindestens einem meiner Konten aktiviert.
        - id: checked_factor_or_recovery
          label: Ich habe bei einer bestehenden MFA/2FA-Einrichtung den verwendeten Faktor oder eine Wiederherstellungsoption geprüft.
        - id: none
          label: Keine dieser Handlungen.
      exclusiveOptions: [none]
    - id: FU_PASSWORD_PM_NONE_REASON
      type: singleChoice
      participantOptional: true
      displayWhen:
        itemId: FU_PASSWORD_PM_ACTIONS
        contains: none
      prompt: Was war der wichtigste Grund dafür, dass du in diesem Bereich keine der genannten Handlungen durchgeführt hast?
      instruction: Du kannst diese Frage unbeantwortet lassen.
      options:
        - id: already_completed
          label: Die relevanten Schritte waren bereits vor der Studie erledigt.
        - id: no_opportunity
          label: Im Zeitraum bestand keine passende Gelegenheit.
        - id: intended_not_done
          label: Die Handlung ist weiterhin beabsichtigt, aber noch nicht erfolgt.
        - id: unsure_how
          label: Unsicherheit über die konkrete Umsetzung.
        - id: time_or_effort
          label: Zu hoher zeitlicher oder praktischer Aufwand.
        - id: manager_trust_concerns
          label: Bedenken, dem Passwortmanager Passwörter anzuvertrauen.
        - id: manager_access_or_recovery_concerns
          label: Bedenken, später den Zugang zum Passwortmanager oder zu gespeicherten Passwörtern zu verlieren.
        - id: technical_barrier
          label: Technische Hindernisse.
        - id: not_relevant
          label: Derzeit keine persönliche Relevanz.
    - id: FU_MFA_NONE_REASON
      type: singleChoice
      participantOptional: true
      displayWhen:
        itemId: FU_MFA_ACTIONS
        contains: none
      prompt: Was war der wichtigste Grund dafür, dass du in diesem Bereich keine der genannten Handlungen durchgeführt hast?
      instruction: Du kannst diese Frage unbeantwortet lassen.
      options:
        - id: already_completed
          label: Die relevanten Schritte waren bereits vor der Studie erledigt.
        - id: no_opportunity
          label: Im Zeitraum bestand keine passende Gelegenheit.
        - id: intended_not_done
          label: Die Handlung ist weiterhin beabsichtigt, aber noch nicht erfolgt.
        - id: unsure_how
          label: Unsicherheit über die konkrete Umsetzung.
        - id: time_or_effort
          label: Zu hoher zeitlicher oder praktischer Aufwand.
        - id: factor_availability_concerns
          label: Bedenken, dass der zusätzliche Faktor später nicht verfügbar sein könnte.
        - id: factor_recovery_concerns
          label: Unsicherheit oder Bedenken bezüglich Wiederherstellung oder Ersatz des zusätzlichen Faktors.
        - id: technical_barrier
          label: Technische Hindernisse.
        - id: not_relevant
          label: Derzeit keine persönliche Relevanz.
analysis:
  role: ancillary-exploratory
  outcomeLabel: selbstberichtete Schutzhandlungen innerhalb von zehn Tagen
  focalOutcomes:
    - replaced_reused_or_varied_password
    - generated_stored_account_specific
    - enabled_mfa
  secondaryDescriptiveOutcomes:
    - inspected_available_manager
    - used_retrieval_or_autofill
    - checked_manager_access_or_recovery
    - checked_availability_or_status
    - checked_factor_or_recovery
  combinedScore: false
  nonResponseMeaning: missing
  opportunityDependent: true
  noActionReasonsOptional: true
privacy:
  emailStoredSeparatelyFromResearchData: true
  emailPurpose: invitation and at most one reminder for the voluntary follow-up
  deletionRule: controlled deletion no later than seven calendar days after the last follow-up window closes
  sendingModel: controlled manual send through the university account
  delayedDebriefEmail: false
  responseImportRequired: false
